/* Shared kit for the getpaper.sh concepts (v3): app windows, mini desktops, devices,
   commands, feature tiles. Pages set the --k-* tokens; the kit never picks colours. */

/* ---- tokens each page maps ----
   --k-desk     desktop behind windows        --k-win    window surface
   --k-bar      window title bar              --k-ink    window text
   --k-dim      secondary text                --k-line   rules, skeleton lines
   --k-soft     quiet fills                   --k-accent focus, selection
   --k-term     terminal body                 --k-term-ink
   --k-code-1..3 syntax colours               --k-menubar / --k-ombar  platform bars        */

/* ---------- full-size app windows (story) ---------- */
.app { position: absolute; left: 0; display: flex; flex-direction: column; background: var(--k-win); color: var(--k-ink);
  border-radius: 14px; overflow: hidden; box-shadow: var(--k-shadow, 0 1px 2px rgba(0,0,0,.08), 0 18px 40px -18px rgba(0,0,0,.35));
  will-change: transform, opacity; }
.app > .tb { flex: none; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--k-bar);
  font: 600 12.5px/1 var(--k-ui, system-ui, sans-serif); color: var(--k-dim); border-bottom: 1px solid var(--k-line); }
.app > .tb b { color: var(--k-ink); font-weight: 700; }
.app > .tb .n { margin-left: auto; font-variant-numeric: tabular-nums; }
.app > .bd { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.app .ring { position: absolute; inset: -8px; border: 3px solid var(--k-ring, var(--k-accent)); border-radius: 21px; opacity: 0; pointer-events: none; }
.app.ed .bd { display: grid; grid-template-columns: 46px 1fr; font: 13px/1.85 var(--k-mono, ui-monospace, monospace); }
.app.ed .gut { padding: 16px 10px; text-align: right; color: var(--k-dim); background: var(--k-soft); white-space: pre; opacity: .8; }
.app.ed pre { margin: 0; padding: 16px 18px; white-space: pre; font: inherit; }
.c1 { color: var(--k-code-1); } .c2 { color: var(--k-code-2); } .c3 { color: var(--k-code-3); } .cm { color: var(--k-dim); }
.app.te { background: var(--k-term); }
.app.te > .tb { background: color-mix(in srgb, var(--k-term) 82%, white); color: #9aa3ad; border-color: rgba(255,255,255,.08); }
.app.te > .tb b { color: #eef1f4; }
.app.te pre { margin: 0; padding: 16px 18px; color: var(--k-term-ink); font: 13px/1.85 var(--k-mono, ui-monospace, monospace); white-space: pre; }
.app.te .ok { color: #7fd8a4; } .app.te .pr { color: #9fb4ff; }
.app.dc .url { margin: 12px 14px 0; padding: 7px 12px; border-radius: 8px; background: var(--k-soft); color: var(--k-dim); font: 12px/1 var(--k-mono, monospace); }
.app.dc article { padding: 26px 30px; }
.app.dc h4 { margin: 0 0 10px; font: 800 30px/1.05 var(--k-display, var(--k-ui, system-ui)); letter-spacing: -.02em; color: var(--k-ink); }
.app.dc p { margin: 0 0 18px; max-width: 34em; font: 15px/1.55 var(--k-ui, system-ui); color: var(--k-dim); }
.app.dc .fig { position: relative; height: 92px; border-radius: 10px; background: var(--k-soft); overflow: hidden; }
.app.dc .fig i { position: absolute; top: 14px; bottom: 14px; border-radius: 5px; background: var(--k-win); box-shadow: 0 0 0 1px var(--k-line); }
.app.dc .fig b { position: absolute; top: 6px; bottom: 6px; left: 30%; width: 40%; border: 2.5px solid var(--k-accent); border-radius: 8px; }
.app.ch .bd { padding: 18px; display: flex; flex-direction: column; gap: 10px; font: 14px/1.35 var(--k-ui, system-ui); }
.app.ch .m { max-width: 80%; padding: 9px 13px; border-radius: 15px; background: var(--k-soft); }
.app.ch .m.me { align-self: flex-end; background: var(--k-accent); color: var(--k-accent-ink, #fff); }
.app.ch .shot { align-self: flex-end; width: 62%; aspect-ratio: 16/9; border-radius: 12px;
  background: linear-gradient(135deg, var(--k-accent), color-mix(in srgb, var(--k-accent) 40%, var(--k-win))); position: relative; overflow: hidden; }
.app.ch .shot::before { content: ""; position: absolute; inset: 22% 6%; border-radius: 4px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.9) 0 22%, transparent 22% 25%); }

/* ---------- mini desktops (tiles, devices) ---------- */
.mini { container-type: inline-size; position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--k-desk); border-radius: 2cqw; isolation: isolate; }
.mini .mbar { position: absolute; z-index: 3; top: 0; left: 0; right: 0; height: 6.2cqw; display: flex; align-items: center; gap: 1.4cqw; padding: 0 2.6cqw;
  font: 700 2.5cqw/1 var(--k-ui, system-ui); }
.mini .mbar.mac { background: var(--k-menubar, rgba(255,255,255,.72)); color: var(--k-ink, #1b1d22); }
.mini .mbar.om { background: var(--k-ombar, #15161a); color: #e9ebef; font-family: var(--k-mono, monospace); }
.mini .mbar .sp { flex: 1; }
.mini .pill { display: inline-flex; align-items: baseline; gap: .3cqw; padding: .7cqw 1.4cqw; border-radius: 9cqw; background: rgba(0,0,0,.08); font-variant-numeric: tabular-nums; }
.mini .pill sup { font-size: .7em; }
.mini .pill.on { background: var(--k-accent); color: var(--k-accent-ink, #fff); }
.mini .mbar.om .pill { background: transparent; padding: .7cqw .9cqw; opacity: .65; }
.mini .mbar.om .pill.on { opacity: 1; color: #fff; background: transparent; box-shadow: inset 0 -.5cqw 0 var(--k-accent); border-radius: 0; }
.mini .mbar .clock { opacity: .7; font-weight: 600; }
.mini .strip { position: absolute; z-index: 1; top: 8.6cqw; bottom: 2.4cqw; left: 0; width: 100cqw; transform: translateX(var(--off, 0cqw)); transition: transform .8s cubic-bezier(.2,.75,.2,1); }
.mini.nobar .strip { top: 2.4cqw; }
.mini .w { position: absolute; top: 0; bottom: 0; left: 0; width: var(--ww); transform: translateX(var(--x)) translateY(var(--y, 0)); opacity: var(--o, 1);
  border-radius: 1.4cqw; overflow: hidden; background: var(--k-win); box-shadow: 0 .3cqw 1.4cqw rgba(0,0,0,.18);
  transition: transform .8s cubic-bezier(.2,.75,.2,1), width .8s cubic-bezier(.2,.75,.2,1), opacity .5s ease, filter .6s ease; }
.mini .w::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3.4cqw; background: var(--k-bar); border-bottom: .2cqw solid var(--k-line); }
.mini .w > i { position: absolute; left: 7%; height: 1.4cqw; border-radius: 1cqw; background: var(--k-line); }
.mini .w.te { background: var(--k-term); } .mini .w.te::before { background: color-mix(in srgb, var(--k-term) 82%, white); border-color: transparent; }
.mini .w.te > i { background: #58606b; } .mini .w.te > i.g { background: #7fd8a4; }
.mini .w.ed > i.a { background: var(--k-code-1); } .mini .w.ed > i.b { background: var(--k-code-2); } .mini .w.ed > i.c { background: var(--k-code-3); }
.mini .w.dc > i.hero { height: 12cqw; left: 7%; right: 7%; width: auto; background: var(--k-soft); }
.mini .w.ch > i.me { left: auto; right: 7%; background: var(--k-accent); }
.mini .w.ph::after { content: ""; position: absolute; left: 7%; right: 7%; top: 12%; height: 48%; border-radius: 1cqw;
  background: linear-gradient(168deg, transparent 58%, #2f6b45 58.5%), linear-gradient(196deg, transparent 52%, #3f8a5a 52.5%), radial-gradient(circle at 74% 30%, #ffe08a 0 9%, transparent 9.5%), linear-gradient(#9cc8ff, #d8e9ff); }
.mini .w.mu::after { content: ""; position: absolute; left: 50%; top: 14%; width: 46%; aspect-ratio: 1; translate: -50% 0; border-radius: 1.2cqw;
  background: conic-gradient(from 200deg, #ff7aa8, #ffb35c, #ffe066, #6ee7b7, #60a5fa, #a78bfa, #ff7aa8); }
.mini .w.f { box-shadow: 0 0 0 .7cqw var(--k-accent), 0 .3cqw 1.4cqw rgba(0,0,0,.18); }
.mini.ll .w:not(.f) { filter: brightness(.45) saturate(.6); }
.mini .frame { position: absolute; z-index: 2; top: 7.4cqw; bottom: 1.2cqw; left: 0; width: 100cqw; border: .5cqw dashed var(--k-accent); border-radius: 2cqw; opacity: 0; transition: opacity .4s; pointer-events: none; }

/* overlays used by feature tiles */
.mini .ov { position: absolute; z-index: 4; transition: opacity .5s ease, transform .6s cubic-bezier(.2,.75,.2,1); }
.mini .mm { left: 3cqw; bottom: 3cqw; height: 9cqw; width: 46cqw; padding: 1.2cqw; border-radius: 1.6cqw; background: var(--k-win); box-shadow: 0 .4cqw 2cqw rgba(0,0,0,.25); }
.mini .mm .t { position: relative; height: 100%; }
.mini .mm .t i { position: absolute; top: 0; bottom: 0; border-radius: .6cqw; background: var(--k-line); }
.mini .mm .t i.f { background: var(--k-accent); }
.mini .mm .t b { position: absolute; top: -.8cqw; bottom: -.8cqw; border: .5cqw solid var(--k-accent); border-radius: 1cqw; transition: left .8s cubic-bezier(.2,.75,.2,1); }
.mini .sw { left: 50%; top: 50%; width: 58cqw; padding: 2.2cqw; border-radius: 2.4cqw; background: var(--k-win); color: var(--k-ink);
  box-shadow: 0 1cqw 5cqw rgba(0,0,0,.35); transform: translate(-50%, -45%) scale(.96); opacity: 0; font: 600 2.6cqw/1.2 var(--k-ui, system-ui); }
.mini .sw .q { padding: 1.4cqw 1.8cqw; border-radius: 1.4cqw; background: var(--k-soft); color: var(--k-dim); margin-bottom: 1.6cqw; }
.mini .sw .q span { color: var(--k-ink); }
.mini .sw .q span::after { content: ""; display: inline-block; width: .3cqw; height: 2.6cqw; margin-left: .2cqw; vertical-align: middle; background: var(--k-accent); }
.mini .sw .r { display: flex; align-items: center; gap: 1.4cqw; padding: 1cqw 1.2cqw; border-radius: 1.2cqw; transition: opacity .4s, background .4s; }
.mini .sw .r i { width: 6cqw; height: 3.8cqw; border-radius: .6cqw; background: var(--k-line); flex: none; }
.mini .sw .r i.t { background: var(--k-term); }
.mini .sw .r small { margin-left: auto; color: var(--k-dim); font-weight: 600; }
.mini .pv { top: 7.2cqw; right: 9cqw; width: 34cqw; aspect-ratio: 16/10; border-radius: 1.6cqw; background: var(--k-desk); box-shadow: 0 .8cqw 3cqw rgba(0,0,0,.35), 0 0 0 .4cqw var(--k-win);
  opacity: 0; transform: translateY(-1.5cqw); overflow: hidden; }
.mini .pv i { position: absolute; top: 12%; bottom: 10%; border-radius: 1cqw; background: var(--k-win); }
.mini .tray { right: 3cqw; bottom: 3cqw; width: 22cqw; height: 13cqw; border-radius: 1.8cqw; background: var(--k-win); box-shadow: 0 .4cqw 2cqw rgba(0,0,0,.25);
  display: grid; place-items: center; color: var(--k-dim); font: 700 2.4cqw/1.1 var(--k-ui, system-ui); text-align: center; }
.mini .tray svg { width: 5cqw; height: 5cqw; display: block; margin: 0 auto .6cqw; }
.mini .ovw { inset: 7.4cqw 3cqw 3cqw; display: grid; grid-template-columns: repeat(2, 1fr); gap: 2.4cqw; opacity: 0; transform: scale(1.06); }
.mini .ovw > div { position: relative; border-radius: 1.4cqw; background: rgba(255,255,255,.14); outline: .3cqw solid rgba(255,255,255,.4); overflow: hidden; }
.mini .ovw > div i { position: absolute; top: 18%; bottom: 14%; border-radius: .8cqw; background: var(--k-win); }
.mini .ovw > div i.t { background: var(--k-term); }
.mini .modes { left: 50%; bottom: 2.6cqw; transform: translateX(-50%); display: flex; gap: .6cqw; padding: .6cqw; border-radius: 9cqw; background: var(--k-win); font: 700 2.2cqw/1 var(--k-ui, system-ui); opacity: 0; }
.mini .modes span { padding: .9cqw 1.6cqw; border-radius: 9cqw; color: var(--k-dim); }
.mini .modes span.on { background: var(--k-accent); color: var(--k-accent-ink, #fff); }
.mini .rule { left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 2cqw; padding: 2cqw 2.6cqw; border-radius: 2.4cqw;
  background: var(--k-win); color: var(--k-ink); box-shadow: 0 1cqw 4cqw rgba(0,0,0,.3); font: 700 2.8cqw/1 var(--k-ui, system-ui); }
.mini .rule .ic { width: 7cqw; height: 7cqw; border-radius: 1.8cqw; background: linear-gradient(135deg, var(--k-code-2), var(--k-code-1)); }
.mini .rule .chip { padding: 1.2cqw 1.8cqw; border-radius: 9cqw; background: var(--k-soft); transition: background .5s, color .5s; }
.mini .rule .arrow { width: 6cqw; height: .5cqw; background: var(--k-dim); position: relative; }
.mini .rule .arrow::after { content: ""; position: absolute; right: -.2cqw; top: -1cqw; border: 1.2cqw solid transparent; border-left-color: var(--k-dim); border-right: 0; }
.mini .ruler { left: 0; right: 0; bottom: .6cqw; height: 1.6cqw; display: block; }
.mini .ruler i { position: absolute; bottom: 0; width: .3cqw; height: 1.6cqw; background: var(--k-accent); opacity: .7; }
.mini .cmdline { left: 4cqw; right: 4cqw; bottom: 4cqw; padding: 2cqw 2.4cqw; border-radius: 1.6cqw; background: var(--k-term); color: var(--k-term-ink);
  font: 600 3cqw/1.4 var(--k-mono, monospace); box-shadow: 0 .6cqw 3cqw rgba(0,0,0,.3); }
.mini .cmdline .pr { color: #9fb4ff; }

/* tile states: .play shows the "after" state; transitions do the motion */
.tile.play .mini .sw, .tile.play .mini .pv, .tile.play .mini .ovw, .tile.play .mini .modes { opacity: 1; transform: none; }
.tile.play .mini .sw { transform: translate(-50%, -50%); }
.tile .mini .sw .r.x { opacity: 1; }
.tile.play .mini .sw .r.x { opacity: .18; }
.tile.play .mini .sw .r.hit { background: color-mix(in srgb, var(--k-accent) 18%, transparent); }
.tile.play .mini .rule .chip { background: var(--k-accent); color: var(--k-accent-ink, #fff); }
.tile.play .mini .frame { opacity: 1; }
.mini .typed { display: inline-block; overflow: hidden; vertical-align: bottom; width: 0; white-space: nowrap; transition: width .9s steps(3); }
.tile.play .mini .typed { width: 1.9em; }
@media (prefers-reduced-motion: reduce) { .mini *, .mini .strip, .mini .w { transition: none !important; } }

/* ---------- devices for the fork ---------- */
.device { position: relative; width: 100%; }
.device .scr { position: relative; padding: 2.6%; border-radius: 4.5% / 7%; background: #16181c; box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset; }
.device .scr .mini { border-radius: 1.6% / 2.6%; }
.device.laptop .base { height: 0; margin: 0 -7%; border-top: 9px solid #c9ccd2; border-radius: 0 0 14px 14px / 0 0 10px 10px; position: relative; }
.device.laptop .base::after { content: ""; position: absolute; left: 50%; top: -9px; width: 16%; height: 4px; translate: -50% 0; background: #a9adb5; border-radius: 0 0 6px 6px; }
.device.monitor .stand { width: 18%; height: 22px; margin: 0 auto; background: linear-gradient(#2a2d33, #1b1d21); clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%); }
.device.monitor .foot { width: 34%; height: 7px; margin: 0 auto; border-radius: 6px; background: #2a2d33; }

/* ---------- commands ---------- */
.k-cmd { display: flex; align-items: stretch; width: 100%; padding: 0; border: 0; border-radius: var(--k-cmd-r, 14px); cursor: pointer; text-align: left; font: inherit;
  background: var(--k-cmd-bg); color: var(--k-cmd-ink); box-shadow: var(--k-cmd-shadow, none); transition: transform .15s; }
.k-cmd code { flex: 1; min-width: 0; padding: 1em 1.15em; font: 500 clamp(13.5px, 1.2vw, 16px)/1.45 var(--k-mono, ui-monospace, monospace); white-space: normal; overflow-wrap: normal; word-break: keep-all; }
.k-cmd .lbl { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 7em; padding: 0 1.1em; font: 750 14px/1 var(--k-ui, system-ui);
  background: var(--k-cmd-lbl, rgba(255,255,255,.12)); border-radius: 0 var(--k-cmd-r, 14px) var(--k-cmd-r, 14px) 0; }
.k-cmd .lbl svg { width: 15px; height: 15px; }
.k-cmd:hover { transform: translateY(-1px); } .k-cmd:active { transform: translateY(1px); }
.k-cmd.done .lbl { background: var(--k-done, #ffe14d); color: #0a0b26; }
.k-after { margin: 10px 0 0; min-height: 1.4em; font: 600 14px/1.4 var(--k-ui, system-ui); color: var(--k-after, inherit); opacity: 0; transition: opacity .3s; }
.k-after.on { opacity: 1; }
@media (max-width: 480px) {
  .k-cmd { flex-direction: column; }
  .k-cmd .lbl { min-height: 44px; border-radius: 0 0 var(--k-cmd-r, 14px) var(--k-cmd-r, 14px); }
}
.k-ghost { display: grid; place-items: center; width: 100%; min-height: 58px; padding: 1em; border-radius: var(--k-cmd-r, 14px); border: 2px dashed var(--k-ghost-line, rgba(127,127,127,.5));
  font: 650 14px/1.35 var(--k-ui, system-ui); color: var(--k-ghost-ink, inherit); text-align: center; }

/* ---------- feature tiles ---------- */
.tile { margin: 0; }
.tile figcaption { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 12px; font: 750 17px/1.25 var(--k-ui, system-ui); }
.tile .plat { flex: none; padding: 3px 9px; border-radius: 99px; font: 700 11.5px/1.4 var(--k-ui, system-ui); border: 1.5px solid currentColor; opacity: .85; }

/* ---------- story chrome ---------- */
.k-snap { position: absolute; left: 0; width: 1px; height: 1px; scroll-snap-align: start; pointer-events: none; }
.k-mini { position: absolute; display: flex; align-items: center; height: 44px; padding: 6px; border-radius: 12px; background: var(--k-win); box-shadow: 0 6px 24px -10px rgba(0,0,0,.45); }
.k-mini .trk { position: relative; height: 100%; }
.k-mini button { position: absolute; top: 0; bottom: 0; padding: 0; border: 0; border-radius: 5px; background: var(--k-line); cursor: pointer; transition: background .2s, opacity .3s; }
.k-mini button[aria-current="true"] { background: var(--k-accent); }
.k-mini button:hover { background: var(--k-dim); }
.k-mini .vw { position: absolute; top: -4px; bottom: -4px; border: 2.5px solid var(--k-accent); border-radius: 8px; pointer-events: none; }
.k-beats { margin: 0; padding: 0; }

/* ---------- silhouette apps (round 4): read at any scale, say nothing ---------- */
.app > .tb .dots { display: inline-flex; gap: 6px; margin-right: 4px; }
.app > .tb .dots::before, .app > .tb .dots::after, .app > .tb .dots { --d: 10px; }
.app > .tb .dots { width: 46px; height: 10px; background: radial-gradient(circle at 5px 5px, var(--k-line) 4.5px, transparent 5px) 0 0 / 18px 10px repeat-x; }
.sil .code { display: grid; gap: 11px; padding: 22px 26px; align-content: start; }
.sil .code i { display: block; height: 9px; border-radius: 5px; background: var(--k-line); min-width: 0; }
.sil .code i[style*="width:0%"] { height: 4px; background: transparent; }
.sil .code i.k { background: var(--k-code-1); } .sil .code i.f { background: var(--k-code-2); } .sil .code i.s { background: var(--k-code-3); }
.sil .code i.h { height: 18px; background: var(--k-ink); opacity: .85; }
.sil.ed2 { display: grid; grid-template-columns: 40px 1fr; }
.sil.ed2 .gut { background: var(--k-soft); }
.app.te2-host, .app:has(.sil.te2) { background: var(--k-term); }
.app:has(.sil.te2) > .tb { background: color-mix(in srgb, var(--k-term) 82%, white); border-color: rgba(255,255,255,.08); color: #9aa3ad; }
.app:has(.sil.te2) > .tb b { color: #eef1f4; }
.sil.te2 .code i { background: #4b525c; } .sil.te2 .code i.g { background: #7fd8a4; } .sil.te2 .code i.p { background: #9fb4ff; }
.sil.ph .url { margin: 12px 14px 0; height: 26px; border-radius: 8px; background: var(--k-soft); }
.sil.ph .photo { margin: 14px 14px 0; height: 42%; border-radius: 10px;
  background: radial-gradient(circle at 78% 30%, #ffe8a3 0 7%, transparent 7.5%), linear-gradient(170deg, transparent 55%, #2b6b4f 55.5% 70%, #1d4a37 70.5%), linear-gradient(195deg, transparent 48%, #3f8a64 48.5%), linear-gradient(#8fc4ff, #d7ecff); }
.sil.ph .code { padding: 16px 16px 0; gap: 9px; }
.sil.ph .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 16px; }
.sil.ph .cards i { height: 64px; border-radius: 8px; background: var(--k-soft); }
.sil.mu { display: grid; justify-items: center; align-content: center; gap: 16px; padding: 22px; }
.sil.mu .art { width: min(70%, 260px); aspect-ratio: 1; border-radius: 14px; background: conic-gradient(from 210deg at 40% 60%, #ff6b9a, #ffb84d, #6b7bff, #36d1b7, #ff6b9a); box-shadow: 0 18px 40px -18px rgba(0,0,0,.45); }
.sil.mu .code { width: min(70%, 260px); padding: 0; justify-items: center; }
.sil.mu .prog { width: min(70%, 260px); height: 5px; border-radius: 3px; background: var(--k-line); overflow: hidden; }
.sil.mu .prog i { display: block; width: 38%; height: 100%; background: var(--k-ink); }
.sil.mu .ctl { display: flex; align-items: center; gap: 22px; }
.sil.mu .ctl i { width: 18px; height: 18px; border-radius: 4px; background: var(--k-line); }
.sil.mu .ctl b { width: 40px; height: 40px; border-radius: 50%; background: var(--k-ink); }

/* Omarchy chrome on a strip: no title bars, square corners, gaps, a coloured active border */
.om-chrome .app { border-radius: 0; box-shadow: none; outline: 2px solid rgba(255,255,255,.08); }
.om-chrome .app > .tb { display: none; }
.om-chrome .app .ring { inset: -3px; border-radius: 0; border-width: 3px; border-color: var(--k-om-border, #8c92ff); }

:root {
  color-scheme: light dark;
  --field: #1b1fe0; --on: #fff; --on-dim: rgba(255,255,255,.8); --rail-off: rgba(255,255,255,.5); --hi: #ffe14d;
  --slab: #fff; --ink: #0a0b26; --dim: #555a7a;
  --k-desk: #dfe2ff; --k-win: #fff; --k-bar: #f3f4fb; --k-ink: #0a0b26; --k-dim: #5b6082; --k-line: #d9dcf0; --k-soft: #eef0fb;
  --k-accent: #1b1fe0; --k-accent-ink: #fff; --k-ring: #fff; --k-term: #10122e; --k-term-ink: #d9def5;
  --k-code-1: #d1006b; --k-code-2: #1b1fe0; --k-code-3: #14804f; --k-om-border: #33ccff;
  --k-ui: "Paper Sans", system-ui, sans-serif; --k-mono: "JetBrains Mono", ui-monospace, monospace; --k-display: "Paper Sans", system-ui;
  --k-cmd-bg: #0a0b26; --k-cmd-ink: #fff; --k-menubar: rgba(255,255,255,.85); --k-ombar: #10122e;
  --k-shadow: 0 2px 4px rgba(5,6,60,.18), 0 30px 60px -30px rgba(5,6,60,.6);
  --wall-mac: linear-gradient(160deg, #6f7dff, #2a2fe8 55%, #11148f); --wall-om: linear-gradient(160deg, #1d2030, #0b0c14);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --field: #1216a8; --slab: #171b54; --ink: #eef0ff; --dim: #b3b8e6;
  --k-desk: #0e1170; --k-win: #1a1e5c; --k-bar: #20256b; --k-ink: #eef0ff; --k-dim: #aab0e0; --k-line: #343a86; --k-soft: #232870;
  --k-accent: #8f96ff; --k-accent-ink: #0a0b26; --k-term: #0b0d33; --k-code-1: #ff8ac2; --k-code-2: #a9afff; --k-code-3: #7fd8a4;
  --k-cmd-bg: #8f96ff; --k-cmd-ink: #0a0b26; --k-cmd-lbl: rgba(0,0,0,.12); --k-menubar: rgba(30,34,96,.9);
} }
:root[data-theme="dark"] { --field: #1216a8; --slab: #171b54; --ink: #eef0ff; --dim: #b3b8e6; --k-desk: #0e1170; --k-win: #1a1e5c; --k-bar: #20256b; --k-ink: #eef0ff; --k-dim: #aab0e0; --k-line: #343a86; --k-soft: #232870; --k-accent: #8f96ff; --k-accent-ink: #0a0b26; --k-cmd-bg: #8f96ff; --k-cmd-ink: #0a0b26; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-snap-type: y proximity; }
body { margin: 0; background: var(--field); color: var(--on); font: 550 17px/1.5 "Paper Sans", system-ui, sans-serif; overflow-x: clip; }
::selection { background: var(--hi); color: #0a0b26; }
a { color: inherit; text-underline-offset: .22em; text-decoration-thickness: 1.5px; }
:focus-visible { outline: 3px solid var(--hi); outline-offset: 3px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; z-index: 30; left: 20px; top: 16px; font-size: 13px; font-weight: 700; color: var(--on-dim); }

/* ---------- story shell ---------- */
.story { position: relative; height: calc(100lvh + var(--beats) * 45lvh); }
.stage { position: sticky; top: 0; height: 100lvh; overflow: hidden; }
.k-still.story { height: auto; }
.k-still .stage { position: relative; }
.strip { position: absolute; inset: 0; will-change: transform; }
.cap { position: absolute; z-index: 6; left: 28px; bottom: 34px; margin: 0; max-width: calc(50vw - 60px); font-weight: 850; font-stretch: 118%;
  font-size: clamp(22px, 2.5vw, 38px); line-height: 1.05; letter-spacing: -.025em; transition: opacity .25s, transform .25s; }
.cap.out { opacity: 0; transform: translateY(8px); }
.pin { position: absolute; z-index: 8; right: 20px; top: 14px; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 0; border-radius: 99px; cursor: pointer;
  background: var(--on); color: #0a0b26; font: 750 14px/1 "Paper Sans"; box-shadow: 0 8px 24px -10px rgba(0,0,0,.5); }
.pin svg { width: 15px; height: 15px; } .pin.done { background: var(--hi); }
.live { position: absolute; z-index: 7; right: 28px; bottom: 38px; display: flex; gap: 8px; opacity: 0; pointer-events: none; transition: opacity .3s; }
.live.on { opacity: 1; pointer-events: auto; }
.live button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 99px; cursor: pointer; background: rgba(255,255,255,.16); color: var(--on); font: 750 14px/1 "Paper Sans"; }
.live button:hover { background: rgba(255,255,255,.28); }
.live button.open { background: var(--on); color: #0a0b26; }
.live svg { width: 16px; height: 16px; }
.k-beats { display: none; }
.k-still .k-beats { display: block; list-style: decimal inside; width: min(900px, calc(100% - 40px)); margin: 24px auto 0; font-weight: 750; font-size: 20px; line-height: 1.6; }
.k-still .cap, .k-still .live { display: none; }

/* the hero window */
.hero .bd { display: flex; flex-direction: column; justify-content: center; padding: clamp(24px, 4vw, 56px); color: var(--k-ink); }
.cat { margin: 0 0 12px; font-size: 15px; font-weight: 650; color: var(--k-dim); }
h1 { margin: 0; font-weight: 900; font-stretch: 125%; font-size: clamp(64px, 8.6vw, 136px); line-height: .82; letter-spacing: -.04em; }
.tag { margin: .38em 0 .2em; font-weight: 850; font-stretch: 112%; font-size: clamp(22px, 2.4vw, 36px); line-height: 1.05; letter-spacing: -.025em; }
.sub { margin: 0 0 1.3em; color: var(--k-dim); font-size: clamp(16px, 1.3vw, 19px); font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 14px 0 0; font-size: 14px; font-weight: 650; color: var(--k-dim); }
.hero .k-after { color: var(--k-accent); }

/* desks: the same strip under macOS and Omarchy chrome */
.desk { position: absolute; z-index: 2; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; will-change: transform; }
.desk .disp { position: absolute; inset: 0; overflow: hidden; border-radius: 0; }
.desk.mac .disp { background: transparent; }
.desk .wall { position: absolute; inset: 0; opacity: 0; }
.desk.mac .wall { background: var(--wall-mac); } .desk.om .wall { background: var(--wall-om); }
.desk .bezel { position: absolute; inset: -2.2%; border-radius: 26px; border: 14px solid #15171c; opacity: 0; pointer-events: none; box-shadow: 0 40px 80px -40px rgba(0,0,0,.6); }
.desk .mbar, .desk .obar { position: absolute; z-index: 3; left: 0; right: 0; top: 0; height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 18px; font: 700 14px/1 "Paper Sans"; opacity: 0; }
.desk .mbar { background: rgba(255,255,255,.8); color: #15171c; }
.desk .obar { background: #0b0c12; color: #e8eaf0; font-family: "JetBrains Mono", monospace; }
.desk .sp { flex: 1; }
.desk .p { padding: 4px 9px; border-radius: 99px; background: rgba(0,0,0,.08); font-variant-numeric: tabular-nums; }
.desk .p.on { background: #1b1fe0; color: #fff; }
.desk .obar .p { background: none; padding: 4px 5px; border-radius: 0; opacity: .6; }
.desk .obar .p.on { opacity: 1; background: none; color: #fff; box-shadow: inset 0 -3px 0 var(--k-om-border); }
.desk .name { position: absolute; left: 50%; top: calc(100% + 34px); translate: -50% 0; white-space: nowrap; font-weight: 900; font-stretch: 122%; font-size: 64px; letter-spacing: -.04em; opacity: 0; }

@media (max-width: 700px) {
  .hero .bd { font-size: 1.15em; padding: 22px; }
  .cap { left: 16px; right: 16px; bottom: 96px; max-width: none; }
  .live { right: 16px; bottom: 24px; } .live .txt, .pin .txt { display: none; }
}

h2 { margin: 0; font-weight: 900; font-stretch: 125%; font-size: clamp(44px, 7vw, 108px); line-height: .86; letter-spacing: -.04em; }
.alpha { color: var(--k-dim); }

/* ---------- features: numbered rail, sections by job, two big pictures each ---------- */
.more { position: relative; width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 96px 0 40px 64px; }
.more::before { content: ""; position: absolute; left: 19px; top: 0; bottom: 0; width: 6px; border-radius: 3px; background: var(--on); }
.more .lede { margin: 18px 0 48px; max-width: 36em; color: var(--on-dim); font-weight: 600; }
.group { position: relative; margin: 0 0 56px; }
.group h3 { position: relative; display: flex; align-items: baseline; gap: 14px; margin: 0 0 20px; font-weight: 850; font-stretch: 118%; font-size: clamp(24px, 2.4vw, 32px); letter-spacing: -.02em; }
.group h3 .no { font: 700 15px/1 "JetBrains Mono", monospace; color: var(--on-dim); letter-spacing: 0; }
.group h3::before { content: ""; position: absolute; left: -58px; top: 50%; width: 22px; height: 22px; translate: 0 -50%; border-radius: 50%; border: 6px solid var(--on); background: var(--field); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }

<style>

  background: linear-gradient(#ffffff, #eceef6); box-shadow: 0 calc(6px - 5px * var(--press)) 0 #b9bdd0, 0 calc(12px - 9px * var(--press)) 18px -6px rgba(0,0,0,.45);

<style>
/* The "Paper" colour theme as the page's only theme. Load after fork5.css and desks6.css.
   The page also sets data-theme="light" on <html>, which keeps v5.css's dark-scheme token block
   (:root:not([data-theme="light"])) from matching, so Paper holds in a dark system scheme too. */
:root { color-scheme: light;
  --field: #f2efe7; --on: #14151a; --on-dim: rgba(20,21,26,.72); --hi: #e2470f; --hi-text: #b53a0a;
  --slab: #ffffff; --ink: #14151a; --dim: #5c5f6b; --rail-off: rgba(20,21,26,.4); }

/* the parts drawn light-on-dark turn dark-on-light */
.trunk, .trunk6, .way, .way .alt, .close, .fork .trunk { --k-cmd-bg: var(--ink); --k-cmd-ink: var(--field); --k-cmd-lbl: rgba(255,255,255,.14); }
.pin { color: var(--field); }
/* white on --hi is 4.08:1; one step darker in the same hue reaches AA (4.53:1) */
.pin.done { background: #d5430e; color: #fff; }
.keys6 kbd { box-shadow: 0 0 0 1px rgba(0,0,0,.14), 0 calc(6px - 5px * var(--press)) 0 #b9bdd0, 0 calc(12px - 9px * var(--press)) 18px -6px rgba(0,0,0,.3); }
.undo { --k-cmd-bg: rgba(0,0,0,.06); --k-cmd-ink: var(--ink); --k-cmd-lbl: rgba(0,0,0,.08); }

/* orange as text on the cream field needs a darker step to reach AA */
.trunk6 .k-after, .fork .trunk .k-after, .close .k-after { color: var(--hi-text); }
</style>
<style>
/* Viewfinder (round 7): windows land, a window is dragged wider and sent full width, the page's own edges
   shrink into a "Your screen" frame, a key walks the strip back and a swipe carries it forward, the frame
   becomes a Mac beside a Linux (Omarchy) screen with their minimaps, and the two screens become the install fork. */
.lay { position: absolute; inset: 0; will-change: transform; }
.lay.mac { z-index: 1; } .lay.om { z-index: 3; opacity: 0; }
.lay.mac .d6 > .cb, .lay.mac .d6 > .cf { opacity: 0; }

.cur { position: absolute; z-index: 6; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; opacity: 0; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }

.swipe .plus { font: 700 20px/1 "Paper Sans"; color: var(--on); opacity: .7; }

.kb { position: absolute; z-index: 5; left: 0; top: 0; opacity: 0; translate: -50% 0; }
.trunk6 { position: absolute; z-index: 5; left: 50%; top: 40px; width: min(620px, calc(100% - 40px)); translate: -50% 0; text-align: center; opacity: 0; pointer-events: none; }
.trunk6 p { margin: 10px 0 0; color: var(--on-dim); font-weight: 600; }
.trunk6.on { pointer-events: auto; }
.rails6 { position: absolute; z-index: 4; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.rails6 path, .fork .rails6b path { fill: none; stroke: var(--on); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.pair6 { display: none; }
.h1 { margin: 0; font-weight: 900; font-stretch: 125%; font-size: clamp(64px, 8.6vw, 136px); line-height: .82; letter-spacing: -.04em; }
.pin { transition: opacity .25s; }

.pin-after { position: absolute; z-index: 8; right: 20px; top: 50px; width: min(330px, calc(100% - 40px)); padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--field); text-align: left; pointer-events: none; }

.dock6 .fork > h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 700px) {
  .pair6 { position: absolute; z-index: 6; left: 16px; right: 16px; top: 64px; display: grid; gap: 10px; opacity: 0; }

    const kx = phone ? W / 2 : fullK ? W - 180 : walking ? fx + fw / 2 : mac.x + fw / 2;
    const ky = phone ? H - 230 : fullK ? H - 114 : both ? mac.y + fh + 74 : mac.y + fh + 26;
    kb[0].style.transform = `translate(${kx}px,${ky}px)`;
    kb[1].style.transform = `translate(${om.x + fw / 2}px,${om.y + fh + 74}px)`;
    kb[0].style.opacity = fullK || walking || both ? 1 : 0; kb[1].style.opacity = both && !phone ? 1 : 0;
    const keyBeat = [3, 5, 6, 7, 10].includes(i.k) ? pressAt(u) : 0;
    D6.press(kb[0], keyBeat); D6.press(kb[1], i.k === 10 ? keyBeat : 0);
    // the mouse: grabs the focused window's right edge and drags it wider
    const ch = s1.querySelector('[data-id="ch"]').getBoundingClientRect(), sr = stage.getBoundingClientRect();
    const curOn = t >= 1.75 && t < 2.95;
    cur.style.opacity = curOn ? Math.min(1, (t - 1.75) / .15, (2.95 - t) / .12) : 0;
    cur.style.transform = `translate(${ch.right - sr.left}px,${ch.top - sr.top + ch.height * .55}px)`;
    // the swipe: hold ⌘⌥ and two fingers slide while the strip pans forward
    const swOn = t >= 7.9 && t < 9.05;
    swipe.style.opacity = swOn ? Math.min(1, (t - 7.9) / .15, (9.05 - t) / .12) : 0;
    swipe.style.transform = `translate(${phone ? W / 2 : fx + fw / 2}px,${phone ? H - 236 : mac.y + fh + 18}px)`;
    const fing = i.k === 8 ? V5.clamp01(u / .62) : 0;
    swipe.querySelectorAll(".pad i").forEach((d, n) => (d.style.transform = `translateX(${(1 - fing) * 30 - fing * 26}px)`));
    D6.press(swipe, swOn ? 1 : 0);
    // the minimaps under both screens: the whole strip, the focused window, and the part each screen shows
    const mapOn = phone ? 0 : V5.clamp01((t - 9.45) / .3) * (1 - V5.clamp01((t - 11) / .2));
    maps.forEach((m) => (m.style.opacity = mapOn));
    if (mapOn > 0) { const f = i.k >= 10 && u > .3 ? "mu" : "ch"; drawMap(maps[0], i, f); drawMap(maps[1], i, f);
      maps[0].style.transform = `translate(${mac.x + fw / 2}px,${mac.y + fh + 24}px)`; maps[1].style.transform = `translate(${om.x + fw / 2}px,${om.y + fh + 24}px)`; }
    // phone: no room for two screens side by side; the two still pictures take over
    if (phone) { const po = V5.clamp01((t - 9) / .4); pair.style.opacity = po; lm.style.opacity = 1 - po; vf.style.opacity = (t < 4 ? 0 : 1) * (1 - po); D6.press(pair, i.k === 10 ? keyBeat : 0); kb[0].style.opacity = fullK || walking ? 1 : 0; }
    // the install trunk drops in above the two screens, and rails run into them and on down the page
    trunk.style.opacity = dock; trunk.classList.toggle("on", dock > .9);
    // the last caption gives way to the install trunk and its rails
    capEl.style.opacity = dock > 0 ? 1 - dock : "";
    pin.style.opacity = t > .5 && dock < .5 ? 1 : 0; pin.style.pointerEvents = t > .5 && dock < .5 ? "" : "none";
    if (dock > 0) {
      const tb = 40 + trunk.offsetHeight + 12, x0 = W / 2, x1 = mac.x + fw / 2, x2 = om.x + fw / 2, ys = (tb + mac.y - 9) / 2;
      const br = (x) => `M${x0},${ys - R} Q${x0},${ys} ${x0 + Math.sign(x - x0) * R},${ys} H${x - Math.sign(x - x0) * R} Q${x},${ys} ${x},${ys + R} V${mac.y - 12}`;
      rIn.setAttribute("d", `M${x0},${tb} V${ys - R} ${br(x1)} ${br(x2)}`);
      rOut.setAttribute("d", `M${x1},${mac.y + fh + 12} V${H} M${x2},${mac.y + fh + 12} V${H}`);
    }
    rIn.style.opacity = rOut.style.opacity = dock;
  },
});

// the install section: columns under the two screens, rails continuing from the stage
// Omarchy windows run nearly full height (30px bar, 10px outer gaps); the engine sizes every strip the same, so redo this one after it
function omHeights() { const H = stage.clientHeight; for (const a of s2.querySelectorAll(".app")) Object.assign(a.style, { top: "40px", height: H - 50 + "px" }); }
omHeights(); addEventListener("resize", omHeights);
function drawDockRails() {
  if (!document.documentElement.classList.contains("dock6")) return;
  // the docked layout, not the current frame: two screens of W x VS with GAP between, centred
  const W = stage.clientWidth, fw = W * VS, x1 = W / 2 - (fw + GAP) / 2, x2 = W / 2 + (fw + GAP) / 2, x0 = W / 2;
  fork.style.setProperty("--cw", fw + "px"); fork.style.setProperty("--cg", GAP + "px");
  const o = fork.getBoundingClientRect(), rel = (el) => { const r = el.getBoundingClientRect(); return { y: r.top - o.top, b: r.bottom - o.top }; };
  const cols = [...fork.querySelectorAll(".col")], who = rel(cols[0].querySelector(".who")), rejoin = rel(fork.querySelector(".rejoin"));
  const yEnd = Math.max(...cols.map((c) => rel(c).b)) + 20, ym = (yEnd + rejoin.y) / 2;
  const back = (x) => `M${x},${yEnd} V${ym - R} Q${x},${ym} ${x + Math.sign(x0 - x) * R},${ym} H${x0 - Math.sign(x0 - x) * R} Q${x0},${ym} ${x0},${ym + R}`;
  rb.setAttribute("d", `M${x1},0 V${who.y - 16} M${x2},0 V${who.y - 16} ${back(x1)} ${back(x2)} M${x0},${ym + R} V${rejoin.y - 6}`);
}
drawDockRails(); addEventListener("resize", drawDockRails); document.fonts?.ready.then(drawDockRails);
</script>
