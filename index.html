<style>
/* Shared kit for the getpaper.sh concepts (v3): app windows, mini desktops, devices,
   commands, feature tiles. Pages set the --k-* tokens; the kit never picks colours. */

/* ---- tokens each page maps ----
   --k-desk     desktop behind windows        --k-win    window surface
   --k-bar      window title bar              --k-ink    window text
   --k-dim      secondary text                --k-line   rules, skeleton lines
   --k-soft     quiet fills                   --k-accent focus, selection
   --k-term     terminal body                 --k-term-ink
   --k-code-1..3 syntax colours               --k-menubar / --k-ombar  platform bars        */

/* ---------- full-size app windows (story) ---------- */
.app { position: absolute; left: 0; display: flex; flex-direction: column; background: var(--k-win); color: var(--k-ink);
  border-radius: 14px; overflow: hidden; box-shadow: var(--k-shadow, 0 1px 2px rgba(0,0,0,.08), 0 18px 40px -18px rgba(0,0,0,.35));
  will-change: transform, opacity; }
.app > .tb { flex: none; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--k-bar);
  font: 600 12.5px/1 var(--k-ui, system-ui, sans-serif); color: var(--k-dim); border-bottom: 1px solid var(--k-line); }
.app > .tb b { color: var(--k-ink); font-weight: 700; }
.app > .tb .n { margin-left: auto; font-variant-numeric: tabular-nums; }
.app > .bd { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.app .ring { position: absolute; inset: -8px; border: 3px solid var(--k-ring, var(--k-accent)); border-radius: 21px; opacity: 0; pointer-events: none; }
.app.ed .bd { display: grid; grid-template-columns: 46px 1fr; font: 13px/1.85 var(--k-mono, ui-monospace, monospace); }
.app.ed .gut { padding: 16px 10px; text-align: right; color: var(--k-dim); background: var(--k-soft); white-space: pre; opacity: .8; }
.app.ed pre { margin: 0; padding: 16px 18px; white-space: pre; font: inherit; }
.c1 { color: var(--k-code-1); } .c2 { color: var(--k-code-2); } .c3 { color: var(--k-code-3); } .cm { color: var(--k-dim); }
.app.te { background: var(--k-term); }
.app.te > .tb { background: color-mix(in srgb, var(--k-term) 82%, white); color: #9aa3ad; border-color: rgba(255,255,255,.08); }
.app.te > .tb b { color: #eef1f4; }
.app.te pre { margin: 0; padding: 16px 18px; color: var(--k-term-ink); font: 13px/1.85 var(--k-mono, ui-monospace, monospace); white-space: pre; }
.app.te .ok { color: #7fd8a4; } .app.te .pr { color: #9fb4ff; }
.app.dc .url { margin: 12px 14px 0; padding: 7px 12px; border-radius: 8px; background: var(--k-soft); color: var(--k-dim); font: 12px/1 var(--k-mono, monospace); }
.app.dc article { padding: 26px 30px; }
.app.dc h4 { margin: 0 0 10px; font: 800 30px/1.05 var(--k-display, var(--k-ui, system-ui)); letter-spacing: -.02em; color: var(--k-ink); }
.app.dc p { margin: 0 0 18px; max-width: 34em; font: 15px/1.55 var(--k-ui, system-ui); color: var(--k-dim); }
.app.dc .fig { position: relative; height: 92px; border-radius: 10px; background: var(--k-soft); overflow: hidden; }
.app.dc .fig i { position: absolute; top: 14px; bottom: 14px; border-radius: 5px; background: var(--k-win); box-shadow: 0 0 0 1px var(--k-line); }
.app.dc .fig b { position: absolute; top: 6px; bottom: 6px; left: 30%; width: 40%; border: 2.5px solid var(--k-accent); border-radius: 8px; }
.app.ch .bd { padding: 18px; display: flex; flex-direction: column; gap: 10px; font: 14px/1.35 var(--k-ui, system-ui); }
.app.ch .m { max-width: 80%; padding: 9px 13px; border-radius: 15px; background: var(--k-soft); }
.app.ch .m.me { align-self: flex-end; background: var(--k-accent); color: var(--k-accent-ink, #fff); }
.app.ch .shot { align-self: flex-end; width: 62%; aspect-ratio: 16/9; border-radius: 12px;
  background: linear-gradient(135deg, var(--k-accent), color-mix(in srgb, var(--k-accent) 40%, var(--k-win))); position: relative; overflow: hidden; }
.app.ch .shot::before { content: ""; position: absolute; inset: 22% 6%; border-radius: 4px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.9) 0 22%, transparent 22% 25%); }

/* ---------- mini desktops (tiles, devices) ---------- */
.mini { container-type: inline-size; position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--k-desk); border-radius: 2cqw; isolation: isolate; }
.mini .mbar { position: absolute; z-index: 3; top: 0; left: 0; right: 0; height: 6.2cqw; display: flex; align-items: center; gap: 1.4cqw; padding: 0 2.6cqw;
  font: 700 2.5cqw/1 var(--k-ui, system-ui); }
.mini .mbar.mac { background: var(--k-menubar, rgba(255,255,255,.72)); color: var(--k-ink, #1b1d22); }
.mini .mbar.om { background: var(--k-ombar, #15161a); color: #e9ebef; font-family: var(--k-mono, monospace); }
.mini .mbar .sp { flex: 1; }
.mini .pill { display: inline-flex; align-items: baseline; gap: .3cqw; padding: .7cqw 1.4cqw; border-radius: 9cqw; background: rgba(0,0,0,.08); font-variant-numeric: tabular-nums; }
.mini .pill sup { font-size: .7em; }
.mini .pill.on { background: var(--k-accent); color: var(--k-accent-ink, #fff); }
.mini .mbar.om .pill { background: transparent; padding: .7cqw .9cqw; opacity: .65; }
.mini .mbar.om .pill.on { opacity: 1; color: #fff; background: transparent; box-shadow: inset 0 -.5cqw 0 var(--k-accent); border-radius: 0; }
.mini .mbar .clock { opacity: .7; font-weight: 600; }
.mini .strip { position: absolute; z-index: 1; top: 8.6cqw; bottom: 2.4cqw; left: 0; width: 100cqw; transform: translateX(var(--off, 0cqw)); transition: transform .8s cubic-bezier(.2,.75,.2,1); }
.mini.nobar .strip { top: 2.4cqw; }
.mini .w { position: absolute; top: 0; bottom: 0; left: 0; width: var(--ww); transform: translateX(var(--x)) translateY(var(--y, 0)); opacity: var(--o, 1);
  border-radius: 1.4cqw; overflow: hidden; background: var(--k-win); box-shadow: 0 .3cqw 1.4cqw rgba(0,0,0,.18);
  transition: transform .8s cubic-bezier(.2,.75,.2,1), width .8s cubic-bezier(.2,.75,.2,1), opacity .5s ease, filter .6s ease; }
.mini .w::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3.4cqw; background: var(--k-bar); border-bottom: .2cqw solid var(--k-line); }
.mini .w > i { position: absolute; left: 7%; height: 1.4cqw; border-radius: 1cqw; background: var(--k-line); }
.mini .w.te { background: var(--k-term); } .mini .w.te::before { background: color-mix(in srgb, var(--k-term) 82%, white); border-color: transparent; }
.mini .w.te > i { background: #58606b; } .mini .w.te > i.g { background: #7fd8a4; }
.mini .w.ed > i.a { background: var(--k-code-1); } .mini .w.ed > i.b { background: var(--k-code-2); } .mini .w.ed > i.c { background: var(--k-code-3); }
.mini .w.dc > i.hero { height: 12cqw; left: 7%; right: 7%; width: auto; background: var(--k-soft); }
.mini .w.ch > i.me { left: auto; right: 7%; background: var(--k-accent); }
.mini .w.ph::after { content: ""; position: absolute; left: 7%; right: 7%; top: 12%; height: 48%; border-radius: 1cqw;
  background: linear-gradient(168deg, transparent 58%, #2f6b45 58.5%), linear-gradient(196deg, transparent 52%, #3f8a5a 52.5%), radial-gradient(circle at 74% 30%, #ffe08a 0 9%, transparent 9.5%), linear-gradient(#9cc8ff, #d8e9ff); }
.mini .w.mu::after { content: ""; position: absolute; left: 50%; top: 14%; width: 46%; aspect-ratio: 1; translate: -50% 0; border-radius: 1.2cqw;
  background: conic-gradient(from 200deg, #ff7aa8, #ffb35c, #ffe066, #6ee7b7, #60a5fa, #a78bfa, #ff7aa8); }
.mini .w.f { box-shadow: 0 0 0 .7cqw var(--k-accent), 0 .3cqw 1.4cqw rgba(0,0,0,.18); }
.mini.ll .w:not(.f) { filter: brightness(.45) saturate(.6); }
.mini .frame { position: absolute; z-index: 2; top: 7.4cqw; bottom: 1.2cqw; left: 0; width: 100cqw; border: .5cqw dashed var(--k-accent); border-radius: 2cqw; opacity: 0; transition: opacity .4s; pointer-events: none; }

/* overlays used by feature tiles */
.mini .ov { position: absolute; z-index: 4; transition: opacity .5s ease, transform .6s cubic-bezier(.2,.75,.2,1); }
.mini .mm { left: 3cqw; bottom: 3cqw; height: 9cqw; width: 46cqw; padding: 1.2cqw; border-radius: 1.6cqw; background: var(--k-win); box-shadow: 0 .4cqw 2cqw rgba(0,0,0,.25); }
.mini .mm .t { position: relative; height: 100%; }
.mini .mm .t i { position: absolute; top: 0; bottom: 0; border-radius: .6cqw; background: var(--k-line); }
.mini .mm .t i.f { background: var(--k-accent); }
.mini .mm .t b { position: absolute; top: -.8cqw; bottom: -.8cqw; border: .5cqw solid var(--k-accent); border-radius: 1cqw; transition: left .8s cubic-bezier(.2,.75,.2,1); }
.mini .sw { left: 50%; top: 50%; width: 58cqw; padding: 2.2cqw; border-radius: 2.4cqw; background: var(--k-win); color: var(--k-ink);
  box-shadow: 0 1cqw 5cqw rgba(0,0,0,.35); transform: translate(-50%, -45%) scale(.96); opacity: 0; font: 600 2.6cqw/1.2 var(--k-ui, system-ui); }
.mini .sw .q { padding: 1.4cqw 1.8cqw; border-radius: 1.4cqw; background: var(--k-soft); color: var(--k-dim); margin-bottom: 1.6cqw; }
.mini .sw .q span { color: var(--k-ink); }
.mini .sw .q span::after { content: ""; display: inline-block; width: .3cqw; height: 2.6cqw; margin-left: .2cqw; vertical-align: middle; background: var(--k-accent); }
.mini .sw .r { display: flex; align-items: center; gap: 1.4cqw; padding: 1cqw 1.2cqw; border-radius: 1.2cqw; transition: opacity .4s, background .4s; }
.mini .sw .r i { width: 6cqw; height: 3.8cqw; border-radius: .6cqw; background: var(--k-line); flex: none; }
.mini .sw .r i.t { background: var(--k-term); }
.mini .sw .r small { margin-left: auto; color: var(--k-dim); font-weight: 600; }
.mini .pv { top: 7.2cqw; right: 9cqw; width: 34cqw; aspect-ratio: 16/10; border-radius: 1.6cqw; background: var(--k-desk); box-shadow: 0 .8cqw 3cqw rgba(0,0,0,.35), 0 0 0 .4cqw var(--k-win);
  opacity: 0; transform: translateY(-1.5cqw); overflow: hidden; }
.mini .pv i { position: absolute; top: 12%; bottom: 10%; border-radius: 1cqw; background: var(--k-win); }
.mini .tray { right: 3cqw; bottom: 3cqw; width: 22cqw; height: 13cqw; border-radius: 1.8cqw; background: var(--k-win); box-shadow: 0 .4cqw 2cqw rgba(0,0,0,.25);
  display: grid; place-items: center; color: var(--k-dim); font: 700 2.4cqw/1.1 var(--k-ui, system-ui); text-align: center; }
.mini .tray svg { width: 5cqw; height: 5cqw; display: block; margin: 0 auto .6cqw; }
.mini .ovw { inset: 7.4cqw 3cqw 3cqw; display: grid; grid-template-columns: repeat(2, 1fr); gap: 2.4cqw; opacity: 0; transform: scale(1.06); }
.mini .ovw > div { position: relative; border-radius: 1.4cqw; background: rgba(255,255,255,.14); outline: .3cqw solid rgba(255,255,255,.4); overflow: hidden; }
.mini .ovw > div i { position: absolute; top: 18%; bottom: 14%; border-radius: .8cqw; background: var(--k-win); }
.mini .ovw > div i.t { background: var(--k-term); }
.mini .modes { left: 50%; bottom: 2.6cqw; transform: translateX(-50%); display: flex; gap: .6cqw; padding: .6cqw; border-radius: 9cqw; background: var(--k-win); font: 700 2.2cqw/1 var(--k-ui, system-ui); opacity: 0; }
.mini .modes span { padding: .9cqw 1.6cqw; border-radius: 9cqw; color: var(--k-dim); }
.mini .modes span.on { background: var(--k-accent); color: var(--k-accent-ink, #fff); }
.mini .rule { left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 2cqw; padding: 2cqw 2.6cqw; border-radius: 2.4cqw;
  background: var(--k-win); color: var(--k-ink); box-shadow: 0 1cqw 4cqw rgba(0,0,0,.3); font: 700 2.8cqw/1 var(--k-ui, system-ui); }
.mini .rule .ic { width: 7cqw; height: 7cqw; border-radius: 1.8cqw; background: linear-gradient(135deg, var(--k-code-2), var(--k-code-1)); }
.mini .rule .chip { padding: 1.2cqw 1.8cqw; border-radius: 9cqw; background: var(--k-soft); transition: background .5s, color .5s; }
.mini .rule .arrow { width: 6cqw; height: .5cqw; background: var(--k-dim); position: relative; }
.mini .rule .arrow::after { content: ""; position: absolute; right: -.2cqw; top: -1cqw; border: 1.2cqw solid transparent; border-left-color: var(--k-dim); border-right: 0; }
.mini .ruler { left: 0; right: 0; bottom: .6cqw; height: 1.6cqw; display: block; }
.mini .ruler i { position: absolute; bottom: 0; width: .3cqw; height: 1.6cqw; background: var(--k-accent); opacity: .7; }
.mini .cmdline { left: 4cqw; right: 4cqw; bottom: 4cqw; padding: 2cqw 2.4cqw; border-radius: 1.6cqw; background: var(--k-term); color: var(--k-term-ink);
  font: 600 3cqw/1.4 var(--k-mono, monospace); box-shadow: 0 .6cqw 3cqw rgba(0,0,0,.3); }
.mini .cmdline .pr { color: #9fb4ff; }

/* tile states: .play shows the "after" state; transitions do the motion */
.tile.play .mini .sw, .tile.play .mini .pv, .tile.play .mini .ovw, .tile.play .mini .modes { opacity: 1; transform: none; }
.tile.play .mini .sw { transform: translate(-50%, -50%); }
.tile .mini .sw .r.x { opacity: 1; }
.tile.play .mini .sw .r.x { opacity: .18; }
.tile.play .mini .sw .r.hit { background: color-mix(in srgb, var(--k-accent) 18%, transparent); }
.tile.play .mini .rule .chip { background: var(--k-accent); color: var(--k-accent-ink, #fff); }
.tile.play .mini .frame { opacity: 1; }
.mini .typed { display: inline-block; overflow: hidden; vertical-align: bottom; width: 0; white-space: nowrap; transition: width .9s steps(3); }
.tile.play .mini .typed { width: 1.9em; }
@media (prefers-reduced-motion: reduce) { .mini *, .mini .strip, .mini .w { transition: none !important; } }

/* ---------- devices for the fork ---------- */
.device { position: relative; width: 100%; }
.device .scr { position: relative; padding: 2.6%; border-radius: 4.5% / 7%; background: #16181c; box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset; }
.device .scr .mini { border-radius: 1.6% / 2.6%; }
.device.laptop .base { height: 0; margin: 0 -7%; border-top: 9px solid #c9ccd2; border-radius: 0 0 14px 14px / 0 0 10px 10px; position: relative; }
.device.laptop .base::after { content: ""; position: absolute; left: 50%; top: -9px; width: 16%; height: 4px; translate: -50% 0; background: #a9adb5; border-radius: 0 0 6px 6px; }
.device.monitor .stand { width: 18%; height: 22px; margin: 0 auto; background: linear-gradient(#2a2d33, #1b1d21); clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%); }
.device.monitor .foot { width: 34%; height: 7px; margin: 0 auto; border-radius: 6px; background: #2a2d33; }

/* ---------- commands ---------- */
.k-cmd { display: flex; align-items: stretch; width: 100%; padding: 0; border: 0; border-radius: var(--k-cmd-r, 14px); cursor: pointer; text-align: left; font: inherit;
  background: var(--k-cmd-bg); color: var(--k-cmd-ink); box-shadow: var(--k-cmd-shadow, none); transition: transform .15s; }
.k-cmd code { flex: 1; min-width: 0; padding: 1em 1.15em; font: 500 clamp(13.5px, 1.2vw, 16px)/1.45 var(--k-mono, ui-monospace, monospace); white-space: normal; overflow-wrap: normal; word-break: keep-all; }
.k-cmd .lbl { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 7em; padding: 0 1.1em; font: 750 14px/1 var(--k-ui, system-ui);
  background: var(--k-cmd-lbl, rgba(255,255,255,.12)); border-radius: 0 var(--k-cmd-r, 14px) var(--k-cmd-r, 14px) 0; }
.k-cmd .lbl svg { width: 15px; height: 15px; }
.k-cmd:hover { transform: translateY(-1px); } .k-cmd:active { transform: translateY(1px); }
.k-cmd.done .lbl { background: var(--k-done, #ffe14d); color: #0a0b26; }
.k-after { margin: 10px 0 0; min-height: 1.4em; font: 600 14px/1.4 var(--k-ui, system-ui); color: var(--k-after, inherit); opacity: 0; transition: opacity .3s; }
.k-after.on { opacity: 1; }
@media (max-width: 480px) {
  .k-cmd { flex-direction: column; }
  .k-cmd .lbl { min-height: 44px; border-radius: 0 0 var(--k-cmd-r, 14px) var(--k-cmd-r, 14px); }
}
.k-ghost { display: grid; place-items: center; width: 100%; min-height: 58px; padding: 1em; border-radius: var(--k-cmd-r, 14px); border: 2px dashed var(--k-ghost-line, rgba(127,127,127,.5));
  font: 650 14px/1.35 var(--k-ui, system-ui); color: var(--k-ghost-ink, inherit); text-align: center; }

/* ---------- feature tiles ---------- */
.tile { margin: 0; }
.tile figcaption { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 12px; font: 750 17px/1.25 var(--k-ui, system-ui); }
.tile .plat { flex: none; padding: 3px 9px; border-radius: 99px; font: 700 11.5px/1.4 var(--k-ui, system-ui); border: 1.5px solid currentColor; opacity: .85; }

/* ---------- story chrome ---------- */
.k-snap { position: absolute; left: 0; width: 1px; height: 1px; scroll-snap-align: start; pointer-events: none; }
.k-mini { position: absolute; display: flex; align-items: center; height: 44px; padding: 6px; border-radius: 12px; background: var(--k-win); box-shadow: 0 6px 24px -10px rgba(0,0,0,.45); }
.k-mini .trk { position: relative; height: 100%; }
.k-mini button { position: absolute; top: 0; bottom: 0; padding: 0; border: 0; border-radius: 5px; background: var(--k-line); cursor: pointer; transition: background .2s, opacity .3s; }
.k-mini button[aria-current="true"] { background: var(--k-accent); }
.k-mini button:hover { background: var(--k-dim); }
.k-mini .vw { position: absolute; top: -4px; bottom: -4px; border: 2.5px solid var(--k-accent); border-radius: 8px; pointer-events: none; }
.k-beats { margin: 0; padding: 0; }

/* ---------- silhouette apps (round 4): read at any scale, say nothing ---------- */
.app > .tb .dots { display: inline-flex; gap: 6px; margin-right: 4px; }
.app > .tb .dots::before, .app > .tb .dots::after, .app > .tb .dots { --d: 10px; }
.app > .tb .dots { width: 46px; height: 10px; background: radial-gradient(circle at 5px 5px, var(--k-line) 4.5px, transparent 5px) 0 0 / 18px 10px repeat-x; }
.sil .code { display: grid; gap: 11px; padding: 22px 26px; align-content: start; }
.sil .code i { display: block; height: 9px; border-radius: 5px; background: var(--k-line); min-width: 0; }
.sil .code i[style*="width:0%"] { height: 4px; background: transparent; }
.sil .code i.k { background: var(--k-code-1); } .sil .code i.f { background: var(--k-code-2); } .sil .code i.s { background: var(--k-code-3); }
.sil .code i.h { height: 18px; background: var(--k-ink); opacity: .85; }
.sil.ed2 { display: grid; grid-template-columns: 40px 1fr; }
.sil.ed2 .gut { background: var(--k-soft); }
.app.te2-host, .app:has(.sil.te2) { background: var(--k-term); }
.app:has(.sil.te2) > .tb { background: color-mix(in srgb, var(--k-term) 82%, white); border-color: rgba(255,255,255,.08); color: #9aa3ad; }
.app:has(.sil.te2) > .tb b { color: #eef1f4; }
.sil.te2 .code i { background: #4b525c; } .sil.te2 .code i.g { background: #7fd8a4; } .sil.te2 .code i.p { background: #9fb4ff; }
.sil.ph .url { margin: 12px 14px 0; height: 26px; border-radius: 8px; background: var(--k-soft); }
.sil.ph .photo { margin: 14px 14px 0; height: 42%; border-radius: 10px;
  background: radial-gradient(circle at 78% 30%, #ffe8a3 0 7%, transparent 7.5%), linear-gradient(170deg, transparent 55%, #2b6b4f 55.5% 70%, #1d4a37 70.5%), linear-gradient(195deg, transparent 48%, #3f8a64 48.5%), linear-gradient(#8fc4ff, #d7ecff); }
.sil.ph .code { padding: 16px 16px 0; gap: 9px; }
.sil.ph .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 16px; }
.sil.ph .cards i { height: 64px; border-radius: 8px; background: var(--k-soft); }
.sil.mu { display: grid; justify-items: center; align-content: center; gap: 16px; padding: 22px; }
.sil.mu .art { width: min(70%, 260px); aspect-ratio: 1; border-radius: 14px; background: conic-gradient(from 210deg at 40% 60%, #ff6b9a, #ffb84d, #6b7bff, #36d1b7, #ff6b9a); box-shadow: 0 18px 40px -18px rgba(0,0,0,.45); }
.sil.mu .code { width: min(70%, 260px); padding: 0; justify-items: center; }
.sil.mu .prog { width: min(70%, 260px); height: 5px; border-radius: 3px; background: var(--k-line); overflow: hidden; }
.sil.mu .prog i { display: block; width: 38%; height: 100%; background: var(--k-ink); }
.sil.mu .ctl { display: flex; align-items: center; gap: 22px; }
.sil.mu .ctl i { width: 18px; height: 18px; border-radius: 4px; background: var(--k-line); }
.sil.mu .ctl b { width: 40px; height: 40px; border-radius: 50%; background: var(--k-ink); }

/* Omarchy chrome on a strip: no title bars, square corners, gaps, a coloured active border */
.om-chrome .app { border-radius: 0; box-shadow: none; outline: 2px solid rgba(255,255,255,.08); }
.om-chrome .app > .tb { display: none; }
.om-chrome .app .ring { inset: -3px; border-radius: 0; border-width: 3px; border-color: var(--k-om-border, #8c92ff); }

  --field: #1b1fe0; --on: #fff; --on-dim: rgba(255,255,255,.8); --rail-off: rgba(255,255,255,.5); --hi: #ffe14d;
  --slab: #fff; --ink: #0a0b26; --dim: #555a7a;
  --k-desk: #dfe2ff; --k-win: #fff; --k-bar: #f3f4fb; --k-ink: #0a0b26; --k-dim: #5b6082; --k-line: #d9dcf0; --k-soft: #eef0fb;
  --k-accent: #1b1fe0; --k-accent-ink: #fff; --k-ring: #fff; --k-term: #10122e; --k-term-ink: #d9def5;
  --k-code-1: #d1006b; --k-code-2: #1b1fe0; --k-code-3: #14804f; --k-om-border: #33ccff;
  --k-ui: "Mona Sans", system-ui, sans-serif; --k-mono: "JetBrains Mono", ui-monospace, monospace; --k-display: "Mona Sans", system-ui;
  --k-cmd-bg: #0a0b26; --k-cmd-ink: #fff; --k-menubar: rgba(255,255,255,.85); --k-ombar: #10122e;
  --k-shadow: 0 2px 4px rgba(5,6,60,.18), 0 30px 60px -30px rgba(5,6,60,.6);
  --wall-mac: linear-gradient(160deg, #6f7dff, #2a2fe8 55%, #11148f); --wall-om: linear-gradient(160deg, #1d2030, #0b0c14);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --field: #1216a8; --slab: #171b54; --ink: #eef0ff; --dim: #b3b8e6;
  --k-desk: #0e1170; --k-win: #1a1e5c; --k-bar: #20256b; --k-ink: #eef0ff; --k-dim: #aab0e0; --k-line: #343a86; --k-soft: #232870;
  --k-accent: #8f96ff; --k-accent-ink: #0a0b26; --k-term: #0b0d33; --k-code-1: #ff8ac2; --k-code-2: #a9afff; --k-code-3: #7fd8a4;
  --k-cmd-bg: #8f96ff; --k-cmd-ink: #0a0b26; --k-cmd-lbl: rgba(0,0,0,.12); --k-menubar: rgba(30,34,96,.9);
} }
:root[data-theme="dark"] { --field: #1216a8; --slab: #171b54; --ink: #eef0ff; --dim: #b3b8e6; --k-desk: #0e1170; --k-win: #1a1e5c; --k-bar: #20256b; --k-ink: #eef0ff; --k-dim: #aab0e0; --k-line: #343a86; --k-soft: #232870; --k-accent: #8f96ff; --k-accent-ink: #0a0b26; --k-cmd-bg: #8f96ff; --k-cmd-ink: #0a0b26; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-snap-type: y proximity; }
body { margin: 0; background: var(--field); color: var(--on); font: 550 17px/1.5 "Mona Sans", system-ui, sans-serif; overflow-x: clip; }
::selection { background: var(--hi); color: #0a0b26; }
a { color: inherit; text-underline-offset: .22em; text-decoration-thickness: 1.5px; }
:focus-visible { outline: 3px solid var(--hi); outline-offset: 3px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; z-index: 30; left: 20px; top: 16px; font-size: 13px; font-weight: 700; color: var(--on-dim); }

/* ---------- story shell ---------- */
.story { position: relative; height: calc(100lvh + var(--beats) * 45lvh); }
.stage { position: sticky; top: 0; height: 100lvh; overflow: hidden; }
.k-still.story { height: auto; }
.k-still .stage { position: relative; }
.strip { position: absolute; inset: 0; will-change: transform; }
.cap { position: absolute; z-index: 6; left: 28px; bottom: 34px; margin: 0; max-width: calc(50vw - 60px); font-weight: 850; font-stretch: 118%;
  font-size: clamp(22px, 2.5vw, 38px); line-height: 1.05; letter-spacing: -.025em; transition: opacity .25s, transform .25s; }
.cap.out { opacity: 0; transform: translateY(8px); }
.pin { position: absolute; z-index: 8; right: 20px; top: 14px; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 0; border-radius: 99px; cursor: pointer;
  background: var(--on); color: #0a0b26; font: 750 14px/1 "Mona Sans"; box-shadow: 0 8px 24px -10px rgba(0,0,0,.5); }
.pin svg { width: 15px; height: 15px; } .pin.done { background: var(--hi); }
.live { position: absolute; z-index: 7; right: 28px; bottom: 38px; display: flex; gap: 8px; opacity: 0; pointer-events: none; transition: opacity .3s; }
.live.on { opacity: 1; pointer-events: auto; }
.live button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 99px; cursor: pointer; background: rgba(255,255,255,.16); color: var(--on); font: 750 14px/1 "Mona Sans"; }
.live button:hover { background: rgba(255,255,255,.28); }
.live button.open { background: var(--on); color: #0a0b26; }
.live svg { width: 16px; height: 16px; }
.k-beats { display: none; }
.k-still .k-beats { display: block; list-style: decimal inside; width: min(900px, calc(100% - 40px)); margin: 24px auto 0; font-weight: 750; font-size: 20px; line-height: 1.6; }
.k-still .cap, .k-still .live { display: none; }

/* the hero window */
.hero .bd { display: flex; flex-direction: column; justify-content: center; padding: clamp(24px, 4vw, 56px); color: var(--k-ink); }
.cat { margin: 0 0 12px; font-size: 15px; font-weight: 650; color: var(--k-dim); }
h1 { margin: 0; font-weight: 900; font-stretch: 125%; font-size: clamp(64px, 8.6vw, 136px); line-height: .82; letter-spacing: -.04em; }
.tag { margin: .38em 0 .2em; font-weight: 850; font-stretch: 112%; font-size: clamp(22px, 2.4vw, 36px); line-height: 1.05; letter-spacing: -.025em; }
.sub { margin: 0 0 1.3em; color: var(--k-dim); font-size: clamp(16px, 1.3vw, 19px); font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 14px 0 0; font-size: 14px; font-weight: 650; color: var(--k-dim); }
.hero .k-after { color: var(--k-accent); }

/* desks: the same strip under macOS and Omarchy chrome */
.desk { position: absolute; z-index: 2; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; will-change: transform; }
.desk .disp { position: absolute; inset: 0; overflow: hidden; border-radius: 0; }
.desk.mac .disp { background: transparent; }
.desk .wall { position: absolute; inset: 0; opacity: 0; }
.desk.mac .wall { background: var(--wall-mac); } .desk.om .wall { background: var(--wall-om); }
.desk .bezel { position: absolute; inset: -2.2%; border-radius: 26px; border: 14px solid #15171c; opacity: 0; pointer-events: none; box-shadow: 0 40px 80px -40px rgba(0,0,0,.6); }
.desk .mbar, .desk .obar { position: absolute; z-index: 3; left: 0; right: 0; top: 0; height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 18px; font: 700 14px/1 "Mona Sans"; opacity: 0; }
.desk .mbar { background: rgba(255,255,255,.8); color: #15171c; }
.desk .obar { background: #0b0c12; color: #e8eaf0; font-family: "JetBrains Mono", monospace; }
.desk .sp { flex: 1; }
.desk .p { padding: 4px 9px; border-radius: 99px; background: rgba(0,0,0,.08); font-variant-numeric: tabular-nums; }
.desk .p.on { background: #1b1fe0; color: #fff; }
.desk .obar .p { background: none; padding: 4px 5px; border-radius: 0; opacity: .6; }
.desk .obar .p.on { opacity: 1; background: none; color: #fff; box-shadow: inset 0 -3px 0 var(--k-om-border); }
.desk .name { position: absolute; left: 50%; top: calc(100% + 34px); translate: -50% 0; white-space: nowrap; font-weight: 900; font-stretch: 122%; font-size: 64px; letter-spacing: -.04em; opacity: 0; }

@media (max-width: 700px) {
  .hero .bd { font-size: 1.15em; padding: 22px; }
  .cap { left: 16px; right: 16px; bottom: 96px; max-width: none; }
  .live { right: 16px; bottom: 24px; } .live .txt, .pin .txt { display: none; }
}

h2 { margin: 0; font-weight: 900; font-stretch: 125%; font-size: clamp(44px, 7vw, 108px); line-height: .86; letter-spacing: -.04em; }
.alpha { color: var(--k-dim); }

/* ---------- features: numbered rail, sections by job, two big pictures each ---------- */
.more { position: relative; width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 96px 0 40px 64px; }
.more::before { content: ""; position: absolute; left: 19px; top: 0; bottom: 0; width: 6px; border-radius: 3px; background: var(--on); }
.more .lede { margin: 18px 0 48px; max-width: 36em; color: var(--on-dim); font-weight: 600; }
.group { position: relative; margin: 0 0 56px; }
.group h3 { position: relative; display: flex; align-items: baseline; gap: 14px; margin: 0 0 20px; font-weight: 850; font-stretch: 118%; font-size: clamp(24px, 2.4vw, 32px); letter-spacing: -.02em; }
.group h3 .no { font: 700 15px/1 "JetBrains Mono", monospace; color: var(--on-dim); letter-spacing: 0; }
.group h3::before { content: ""; position: absolute; left: -58px; top: 50%; width: 22px; height: 22px; translate: 0 -50%; border-radius: 50%; border: 6px solid var(--on); background: var(--field); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.tile { margin: 0; padding: 16px 16px 18px; border-radius: 22px; background: var(--slab); color: var(--ink); }
.tile .mini { border-radius: 12px; }
.tile figcaption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; font-weight: 750; font-size: 18px; }
.tile .on { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: var(--k-dim); white-space: nowrap; }
.tile .on svg { width: 15px; height: 15px; }

/* ---------- close ---------- */
.close { padding: 72px 20px 80px; text-align: center; --k-cmd-bg: #fff; --k-cmd-ink: #0a0b26; --k-cmd-lbl: rgba(10,11,38,.08); }
.close .cmdw { width: min(640px, 100%); margin: 0 auto; }
.close .links { justify-content: center; color: var(--on-dim); }
.close .k-after { color: var(--hi); }
.close .alpha { color: var(--on-dim); }

@media (max-width: 700px) {
  .more { padding-left: 44px; } .more::before { left: 9px; } .group h3::before { left: -45px; width: 18px; height: 18px; border-width: 5px; }
  .tiles { grid-template-columns: 1fr; }
}
.desk .name { display: flex; align-items: center; gap: .22em; }
.desk .name svg { width: .8em; height: .8em; }
.stage .live button .txt { white-space: nowrap; }
.k-still .k-beats { margin-bottom: 72px; }
</style>
<style>
/* Round 5 install fork: both branches share one grid, so every row lines up across them.
   The rails are one SVG drawn from measured positions (fork5.js), so they always meet. */
.fork { position: relative; padding: 0 20px 24px; text-align: center; }
.fork > h2 { position: relative; z-index: 1; }
.fork .trunk { position: relative; z-index: 1; width: min(620px, 100%); margin: 40px auto 0; --k-cmd-bg: #fff; --k-cmd-ink: #0a0b26; --k-cmd-lbl: rgba(10,11,38,.08); }
.fork .trunk p { margin: 12px 0 0; color: var(--on-dim); font-weight: 600; }
.fork .trunk .k-after { color: var(--hi); }
.fork .rails { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.fork .rails path { fill: none; stroke: var(--on); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }

.cols { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 440px)); grid-template-rows: repeat(7, auto);
  justify-content: center; column-gap: clamp(28px, 8vw, 140px); margin: 104px auto 0; }
.col { display: grid; grid-row: span 7; grid-template-rows: subgrid; justify-items: center; align-items: start; row-gap: 18px; min-width: 0; }
.col > * { width: 100%; }

/* both machines: same screen size and aspect; the foot area below is the same height for laptop base and stand */
.dev { position: relative; display: grid; justify-items: center; }
.dev .scr { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border: 10px solid #15171c; background: #15171c; }
.dev.laptop .scr { border-radius: 16px 16px 4px 4px; }
.dev.monitor .scr { border-radius: 10px; }
.dev .foot { position: relative; width: 100%; height: 34px; }
.dev.laptop .foot::before { content: ""; position: absolute; left: -6%; right: -6%; top: 0; height: 12px; border-radius: 2px 2px 12px 12px; background: #cfd3e6; }
.dev.monitor .foot::before { content: ""; position: absolute; left: 50%; top: 0; width: 16%; height: 24px; translate: -50% 0; background: #15171c; }
.dev.monitor .foot::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 34%; height: 10px; translate: -50% 0; border-radius: 6px 6px 2px 2px; background: #15171c; }

.osname { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 4px 0 0; font-weight: 900; font-stretch: 122%; font-size: clamp(34px, 3.8vw, 56px); line-height: 1; letter-spacing: -.04em; }
.osname svg { width: .86em; height: .86em; flex: none; }
.prod { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0 0; font-weight: 700; color: var(--on-dim); }
.prod svg { width: 20px; height: 20px; }
.req { margin: 0; font-weight: 700; }
/* .way dissolves into the column's subgrid so lead, box and link sit on the same rows in both columns */
.way { display: contents; --k-cmd-bg: #fff; --k-cmd-ink: #0a0b26; --k-cmd-lbl: rgba(10,11,38,.08); }
.way .lead { margin: 0 0 -8px; font-size: 14px; font-weight: 700; color: var(--on-dim); }
.way .alt { align-self: stretch; display: flex; --k-cmd-bg: #fff; --k-cmd-ink: #0a0b26; --k-cmd-lbl: rgba(10,11,38,.08); }
.way .k-cmd { min-height: 84px; height: auto; align-items: stretch; }
.way .k-cmd code { display: flex; align-items: center; text-align: left; padding: .8em 1.15em; overflow-wrap: anywhere; }
.way .k-cmd .lbl { align-self: stretch; }
.k-cmd:disabled { opacity: .45; cursor: default; transform: none; }
.way .more-way { margin: 0; font-size: 14px; font-weight: 650; }
.col .note { margin: 0; font-size: 14px; color: var(--on-dim); }

.rejoin { position: relative; z-index: 1; margin-top: 96px; }
.rejoin p { margin: 0; padding-top: 14px; font-weight: 850; font-stretch: 118%; font-size: clamp(24px, 3vw, 40px); letter-spacing: -.025em; }

/* phone: one rail down the left with two stops, branches stacked */
@media (max-width: 700px) {
  .way { display: grid; gap: 10px; } .way .lead { margin: 0; }
  .cols { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; row-gap: 56px; margin-top: 88px; padding-left: 34px; }
  .col { grid-row: auto; grid-template-rows: none; justify-items: start; text-align: left; }
  .osname, .prod { justify-content: flex-start; }
  .dev { width: 78%; }
  .rejoin { margin-top: 56px; }
}

.undo { position: relative; z-index: 1; width: min(640px, 100%); margin: 28px auto 0; text-align: left; font-size: 14px; color: var(--on-dim); --k-cmd-bg: rgba(255,255,255,.12); --k-cmd-ink: #fff; --k-cmd-lbl: rgba(255,255,255,.12); }
.undo summary { width: fit-content; margin: 0 auto; cursor: pointer; font-weight: 700; }
.undo[open] { display: grid; gap: 10px; }
.undo p { margin: 0; }
.undo .os { margin: 8px 0 -2px; font-weight: 750; color: var(--on); }
/* install commands stay on one line wherever the column is wide enough */
@media (min-width: 1100px) { .way .k-cmd code { white-space: nowrap; font-size: 13.5px; } }
</style>
<style>
/* Round 6: realistic macOS and Omarchy desktops around a strip, plus keycaps.
   Omarchy values come from basecamp/omarchy (quattro): Tokyo Night theme colors.toml,
   looknfeel.lua (border_size 2, rounding 0, inactive rgba(595959aa), active = theme accent),
   config/omarchy/shell.json (bar on top, menu + workspaces left, clock "dddd HH:mm" centre, status right). */

/* a desk is a full-stage-size layer; pages place, clip or scale it */
.d6 { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; }
/* chrome sits in two full-layer boxes, behind (.cb) and in front of (.cf) the strip, so a page can move it onto a zoomed screen */
.d6 > .cb, .d6 > .cf { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; pointer-events: none; }
.d6 > .cb { z-index: 0; } .d6 > .cf { z-index: 3; }
.d6 .wp, .d6 .bar6, .d6 .dock { position: absolute; pointer-events: none; }
.d6 .wp { inset: 0; }
.d6 > .strip { z-index: 1; }
.d6 .bar6 { left: 0; right: 0; top: 0; display: flex; align-items: center; white-space: nowrap; }
.bar6 svg { flex: none; }

/* ---------- macOS ---------- */
.d6.mac .wp { background:
  radial-gradient(70% 90% at 12% 108%, #ff9a62 0%, rgba(255,154,98,0) 60%),
  radial-gradient(60% 70% at 92% -6%, #8b7dff 0%, rgba(139,125,255,0) 62%),
  radial-gradient(80% 60% at 60% 70%, rgba(38,104,255,.85) 0%, rgba(38,104,255,0) 70%),
  linear-gradient(165deg, #2546d8 0%, #16237e 55%, #0b0f3d 100%); }
.d6.mac .bar6 { height: 34px; padding: 0 16px; gap: 22px; color: #fff; font: 600 14px/1 "Mona Sans", system-ui; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.d6.mac .bar6 .app-name { font-weight: 800; }
.d6.mac .bar6 .menus { display: flex; gap: 20px; font-weight: 550; }
.d6.mac .bar6 .sp { flex: 1; }
.d6.mac .bar6 .st { display: flex; align-items: center; gap: 16px; font-weight: 550; }
.d6.mac .bar6 svg { width: 17px; height: 17px; }
.d6.mac .bar6 .apple svg { width: 15px; height: 17px; margin-top: -2px; }
.d6.mac .dock { left: 50%; bottom: 10px; translate: -50% 0; display: flex; gap: 10px; padding: 9px 12px; border-radius: 26px;
  background: rgba(255,255,255,.22); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 10px 30px -10px rgba(0,0,0,.4); }
.d6.mac .dock i { width: 52px; height: 52px; border-radius: 13px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.d6.mac .dock i:nth-child(1) { background: linear-gradient(160deg, #6ec6ff, #1f6fff); }
.d6.mac .dock i:nth-child(2) { background: linear-gradient(160deg, #fdfdfd, #d9dce6); }
.d6.mac .dock i:nth-child(3) { background: linear-gradient(160deg, #ff6a8b, #f2304f); }
.d6.mac .dock i:nth-child(4) { background: linear-gradient(160deg, #3a3d4a, #15161c); }
.d6.mac .dock i:nth-child(5) { background: linear-gradient(160deg, #7ef0a6, #20b86a); }
.d6.mac .dock i:nth-child(6) { background: linear-gradient(160deg, #ffd36a, #ff9b2e); }
.d6.mac .dock i:nth-child(7) { background: linear-gradient(160deg, #b9a5ff, #6d4dff); }
/* macOS windows: big radius, traffic lights, centred title, no Paper badge */
.d6.mac .app { border-radius: 16px; box-shadow: 0 0 0 .5px rgba(0,0,0,.25), 0 22px 50px -20px rgba(0,0,0,.55); }
.d6.mac .app > .tb { justify-content: center; position: relative; background: var(--k-bar); }
.d6.mac .app > .tb .dots { display: none; }
.d6.mac .app > .tb::before { content: ""; position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 12px; height: 12px; border-radius: 50%;
  background: #ff5f57; box-shadow: 20px 0 0 #febc2e, 40px 0 0 #28c840; }
.d6.mac .app > .tb .n { display: none; }
.d6.mac .app .ring { inset: -6px; border-radius: 21px; border-width: 4px; border-color: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }

/* ---------- Omarchy (Tokyo Night) ---------- */
.d6.om { --k-win: #1a1b26; --k-bar: #16161e; --k-ink: #c0caf5; --k-dim: #565f89; --k-line: #292e42; --k-soft: #24283b;
  --k-accent: #7aa2f7; --k-accent-ink: #1a1b26; --k-term: #13141c; --k-term-ink: #a9b1d6;
  --k-code-1: #f7768e; --k-code-2: #7aa2f7; --k-code-3: #9ece6a; }
.d6.om .wp { background:
  radial-gradient(60% 80% at 80% 110%, rgba(187,154,247,.28) 0%, rgba(187,154,247,0) 65%),
  radial-gradient(50% 60% at 10% 0%, rgba(122,162,247,.22) 0%, rgba(122,162,247,0) 70%),
  linear-gradient(180deg, #1a1b26, #13141c); }
.d6.om .bar6 { height: 30px; padding: 0 12px; background: #1a1b26; color: #a9b1d6; font: 500 13px/1 "JetBrains Mono", monospace; }
.d6.om .bar6 .ws { display: flex; align-items: center; gap: 12px; margin-left: 12px; }
.d6.om .bar6 .ws b { width: 9px; height: 9px; background: #c0caf5; }
.d6.om .bar6 .ws span { opacity: .75; }
.d6.om .bar6 .om-logo svg { width: 15px; height: 15px; }
.d6.om .bar6 .clock { position: absolute; left: 50%; translate: -50% 0; }

.d6.om .bar6 svg { width: 15px; height: 15px; }
/* Omarchy windows: square, no title bar, 2px inactive border, theme-accent active border */
.d6.om .app { border-radius: 0; box-shadow: none; outline: 2px solid rgba(89,89,89,.67); outline-offset: -2px; }
.d6.om .app > .tb { display: none; }
.d6.om .app .ring { inset: 0; border-radius: 0; border: 2px solid #7aa2f7; box-shadow: none; }
.d6.om .sil.ph .photo { filter: saturate(.85) brightness(.9); }

/* ---------- keycaps ---------- */

<script>
// Shared kit for the getpaper.sh concepts (v3). One global, Paper, with:

(() => {
  const P = (window.Paper = {});

  // ---------- full-size app windows ----------
  const APPS = {
    ed: (n) => `<div class="tb"><b>Editor</b>strip.ts<span class="n">${n}</span></div><div class="bd"><div class="gut">${Array.from({ length: 22 }, (_, i) => i + 1).join("\n")}</div><pre><span class="cm">// A new window lands right after the one you're in.</span>
<span class="c1">export function</span> <span class="c2">open</span>(strip: Strip, win: Window) {
  <span class="c1">const</span> at = strip.<span class="c2">indexOf</span>(strip.focused) + <span class="c3">1</span>
  strip.<span class="c2">insert</span>(at, win)     <span class="cm">// nothing lands on top</span>
  strip.<span class="c2">focus</span>(win)
  view.<span class="c2">centerOn</span>(win)    <span class="cm">// the view moves, not the windows</span>
}

<span class="cm">// Widths snap to a few sizes instead of shrinking.</span>
<span class="c1">const</span> PRESETS = [<span class="c3">1/3</span>, <span class="c3">1/2</span>, <span class="c3">2/3</span>, <span class="c3">9/10</span>]

<span class="c1">export function</span> <span class="c2">wider</span>(win: Window) {
  <span class="c1">const</span> next = PRESETS.<span class="c2">find</span>((p) => p > win.width)
  win.width = next ?? PRESETS[<span class="c3">0</span>]
}

<span class="c1">export function</span> <span class="c2">scroll</span>(strip: Strip, by: <span class="c2">number</span>) {
  strip.<span class="c2">focus</span>(strip.<span class="c2">at</span>(strip.focusedIndex + by))
}</pre></div><div class="ring"></div>`,
    te: (n) => `<div class="tb"><b>Terminal</b>~/strip<span class="n">${n}</span></div><div class="bd"><pre><span class="pr">~/strip $</span> bun test
<span class="ok">✓</span> lands after the focused window
<span class="ok">✓</span> keeps every width
<span class="ok">✓</span> never overlaps
<span class="ok">✓</span> scrolls to anything
  4 pass  0 fail

<span class="pr">~/strip $</span> git log --oneline -3
a41c2e9 widths snap, never shrink
7f03b11 focus centers the window
c9d5e20 open lands after focus

<span class="pr">~/strip $</span> <span class="ok">█</span></pre></div><div class="ring"></div>`,
    dc: (n) => `<div class="tb"><b>Browser</b><span class="n">${n}</span></div><div class="bd"><div class="url">docs / the-strip</div><article><h4>The strip</h4><p>Your windows sit side by side, in the order you opened them. Nothing shrinks to fit and nothing overlaps. The screen is a view onto the strip, and moving focus moves the view.</p><div class="fig"><i style="left:4%;width:16%"></i><i style="left:22%;width:12%"></i><i style="left:36%;width:22%"></i><i style="left:60%;width:16%"></i><i style="left:78%;width:18%"></i><b></b></div></article></div><div class="ring"></div>`,
    ch: (n) => `<div class="tb"><b>Chat</b>#desk<span class="n">${n}</span></div><div class="bd"><div class="m" style="width:62%">&nbsp;</div><div class="m me" style="width:48%">&nbsp;</div><div class="m" style="width:70%">&nbsp;</div><div class="m me" style="width:34%">&nbsp;</div><div class="shot" aria-hidden="true"></div></div><div class="ring"></div>`,

  const bars = (spec) => spec.map(([c, w]) => `<i class="${c}" style="width:${w}%"></i>`).join("");
  Object.assign(APPS, {

  const LINES = {

    function set(st) {
      let x = 0; const pos = {};
      for (const id of st.order) { const w = st.w[id]; pos[id] = { x, w }; x += w * 100 + GAP; }

    switcher: { bar: "mac", pills: [{ n: 1, c: 4, on: 1 }, { n: 2, c: 3 }], wins: { a: "ed", b: "dc", c: "ch" },
      A: { order: ["a", "b", "c"], w: { a: .5, b: .5, c: .34 }, focus: "b" }, B: { order: ["a", "b", "c"], w: { a: .5, b: .5, c: .34 }, focus: "b" },
      overlay: `<div class="ov sw"><div class="q">Type to filter windows or Desktops… <span class="typed">ter</span></div><div class="r x"><i></i>Editor<small>1</small></div><div class="r hit"><i class="t"></i>Terminal<small>2</small></div><div class="r x"><i></i>Browser<small>1</small></div><div class="r x"><i></i>Chat<small>2</small></div></div>` },

<script>
// Round 5 install fork. Needs kit.js (Paper.copy) and logos.js.
(() => {
  const F = (window.Fork5 = {});
  const CURL = "curl -fsSL <wbr>https://getpaper.sh/install <wbr>| sh";
  F.CURL = CURL;
  // disabled: a visible but inert box (no data-copy, so Paper.copy never wires it)
  F.cmd = (code, after, disabled) => disabled
    ? `<button class="k-cmd" type="button" disabled aria-disabled="true"><code>${code}</code><span class="lbl">Copy</span></button>`
    : `<button class="k-cmd" type="button" data-copy${after ? ` data-after="${after}"` : ""}><code>${code}</code><span class="lbl">Copy</span></button>`;

  // c: copy strings; screens: markup for the two machine screens
  F.html = (c, screens = {}) => `
  <section class="fork" id="install" aria-labelledby="install-h">
    <svg class="rails" aria-hidden="true"><path class="r-in"/><path class="r-out"/></svg>
    <h2 id="install-h">${c.title}</h2>
    <div class="trunk">${F.cmd(CURL, "after-fork")}<p class="k-after" id="after-fork" data-mac-extra>${c.copied}</p><p>${c.trunk}</p></div>
    <div class="cols">
      <div class="col" data-os="mac">
        <div class="dev laptop" aria-hidden="true"><div class="scr">${screens.mac || ""}</div><div class="foot"></div></div>
        <div class="who"><h3 class="osname">${LOGOS.apple}macOS</h3><p class="prod">PaperMac</p></div>
        <p class="req">Requires macOS 27 or newer.</p>
        <div class="way"><p class="lead">On a Mac, it installs PaperMac</p><div class="alt">${F.cmd(CURL)}</div><p class="more-way"><a href="https://dl.getpaper.sh/papermac/PaperMac-27.0.0-alpha.5.dmg">Or download the DMG</a></p></div>
        <p class="note">Verifies the checksum and signature and never asks for sudo.</p>
      </div>
      <div class="col" data-os="lin">
        <div class="dev monitor" aria-hidden="true"><div class="scr">${screens.lin || ""}</div><div class="foot"></div></div>
        <div class="who"><h3 class="osname">${LOGOS.linux}Linux</h3><p class="prod">Paperland</p></div>
        <p class="req">Requires Omarchy 4 and Hyprland 0.56, or newer.</p>
        <div class="way"><p class="lead">On Omarchy, it installs Paperland</p><div class="alt">${F.cmd(CURL)}</div><p class="more-way"><a href="https://github.com/getpapersh/paperland">Or view it on GitHub</a></p></div>
        <p class="note">Pins and validates the plugin before it changes anything.</p>
      </div>
    </div>
    <div class="rejoin"><p>${c.rejoin}</p></div>
    <details class="undo" id="uninstall"><summary>Uninstall</summary>
      <p class="os">macOS</p>${F.cmd("curl -fsSL <wbr>https://getpaper.sh/install <wbr>| sh -s -- --uninstall")}
      <p>If PaperMac crashed or was force-quit, open it once and quit it before uninstalling, so it can return any hidden windows.</p>
      <p class="os">Linux</p>${F.cmd("curl -fsSL <wbr>https://getpaper.sh/install <wbr>| sh -s -- --uninstall")}
    </details>
  </section>`;

  // Rails: trunk -> split to each machine; each branch -> merge into the line above the rejoin.
  // Desktop draws a fork; phone draws one rail down the left gutter past both branches.
  F.rails = (sec) => {
    // a page that hides the trunk draws its own rails
    if (!sec.querySelector(".trunk")?.offsetParent) return;
    const svg = sec.querySelector(".rails"), pin = svg.querySelector(".r-in"), pout = svg.querySelector(".r-out");
    const draw = () => {
      const o = sec.getBoundingClientRect(), rel = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - o.left, y: r.top - o.top, w: r.width, h: r.height, cx: r.left - o.left + r.width / 2 }; };
      const trunk = rel(sec.querySelector(".trunk")), cols = [...sec.querySelectorAll(".col")].map(rel), devs = [...sec.querySelectorAll(".dev")].map(rel);
      const rejoin = rel(sec.querySelector(".rejoin")), title = rel(sec.querySelector("h2"));
      const R = 28, x0 = trunk.cx;
      if (innerWidth <= 700) {
        // one rail: from above the title, down the gutter, ending at the rejoin
        // the turn into the gutter sits between the trunk and the first branch, never above the line's start
        const gx = cols[0].x - 20, y0 = trunk.y + trunk.h + 14, yh = Math.max(y0 + R, (y0 + cols[0].y) / 2);
        pin.setAttribute("d", `M${x0},0 V${title.y - 16}`);
        pout.setAttribute("d", `M${x0},${y0} V${yh - R} Q${x0},${yh} ${x0 - R},${yh} H${gx + R} Q${gx},${yh} ${gx},${yh + R} V${rejoin.y - 14}`);
        return;
      }
      const ys = (trunk.y + trunk.h + devs[0].y) / 2 + 10, yTop = devs[0].y - 12;
      const yEnd = Math.max(cols[0].y + cols[0].h, cols[1].y + cols[1].h) + 20, ym = (yEnd + rejoin.y) / 2;
      const [x1, x2] = devs.map((d) => d.cx);
      const branch = (x) => `M${x0},${ys - R} Q${x0},${ys} ${x0 + Math.sign(x - x0) * R},${ys} H${x - Math.sign(x - x0) * R} Q${x},${ys} ${x},${ys + R} V${yTop}`;
      pin.setAttribute("d", `M${x0},0 V${title.y - 16} M${x0},${trunk.y + trunk.h + 14} V${ys - R} ${branch(x1)} ${branch(x2)}`);
      const back = (x) => `M${x},${yEnd} V${ym - R} Q${x},${ym} ${x + Math.sign(x0 - x) * R},${ym} H${x0 - Math.sign(x0 - x) * R} Q${x0},${ym} ${x0},${ym + R}`;
      pout.setAttribute("d", `${back(x1)} ${back(x2)} M${x0},${ym + R} V${rejoin.y - 6}`);
    };
    draw();
    new ResizeObserver(draw).observe(sec);
    document.fonts?.ready.then(draw);
  };
})();
</script>
<script>
// Round 5: one copy deck for every concept (see _review/r3-10-synthesis.md). Needs kit.js, logos.js, fork5.js.
(() => {
  const V = (window.V5 = {});
  const cmd = Fork5.cmd, CURL = Fork5.CURL;
  V.COPIED = "Copied. Paste it in a terminal. It installs PaperMac on macOS or Paperland on Omarchy.";
  V.MAC_EXTRA = " PaperMac will then ask for Accessibility access.";
  V.LEDE = "If you've used PaperWM or niri, you already know how it works. Every window stays a glance away.";
  V.CAPS = ["New windows open beside your current one.", "Nothing shrinks or overlaps.", "Four widths, no dragging.", "The same strip on macOS and Omarchy."];

  V.heroHTML = () => `
    <p class="cat">A scrolling-tiling window manager for macOS and Omarchy</p>
    <h1 id="title">Paper</h1>
    <p class="tag">Your desktop is wider than your screen.</p>
    ${cmd(CURL, "after-hero")}
    <p class="k-after" id="after-hero" data-mac-extra>${V.COPIED}</p>
    <p class="links"><a href="/install">Read the script</a><a href="#uninstall">Uninstall</a><span class="alpha">Alpha</span></p>`;

  V.forkHTML = (screens) => Fork5.html({ title: "Install", copied: V.COPIED, trunk: "This command detects your system.", rejoin: "Open a few windows and watch them line up." }, screens);

  // a platform-only feature names its platform; the mark alone is too small to read
  const on = (p) => `<span class="on">${LOGOS[p === "mac" ? "apple" : "omarchy"]}${p === "mac" ? "macOS" : "Omarchy"}</span>`;
  V.GROUPS = [
    ["Get around", [["minimap", "The whole strip at a glance", ""], ["pills", "Hover the bar to preview", ""]]],
    ["Find a window", [["overview", "See every window at once", on("om")], ["switcher", "Type to find any window", on("mac")]]],
    ["Focus on one", [["limelight", "Dim everything else", on("mac")], ["snooze", "Snooze a window for later", on("mac")]]],
  ];
  V.groupHTML = ([name, tiles], i) => `<div class="group"><h3><span class="no">0${i + 1}</span>${name}</h3><div class="tiles">${tiles.map(([k, cap, plat]) => `<figure class="tile" data-tile="${k}"><figcaption><span>${cap}</span>${plat}</figcaption></figure>`).join("")}</div></div>`;
  V.moreHTML = () => `
  <section class="more" aria-labelledby="more-h">
    <h2 id="more-h">Beyond the arrow keys.</h2>
    <p class="lede">${V.LEDE}</p>
    ${V.GROUPS.map(V.groupHTML).join("")}
  </section>`;

  V.closeHTML = () => `
  <section class="close" aria-label="Install">
    <div class="cmdw">${cmd(CURL, "after-close")}<p class="k-after" id="after-close" data-mac-extra>${V.COPIED}</p></div>
    <p class="links"><a href="/install">Read the script</a><a href="https://github.com/getpapersh">GitHub</a><span class="alpha">Alpha</span></p>
  </section>`;

  V.APPS = (ids) => ids.map(([k, id, n]) => Paper.app(k, id, n)).join("");

  V.wire = () => {
    document.documentElement.classList.replace("no-js", "js");
    const live = document.getElementById("live");
    for (const b of document.querySelectorAll(".k-cmd .lbl")) if (!b.querySelector("svg")) b.insertAdjacentHTML("afterbegin", Paper.ICON_COPY);
    const plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.userAgent;
    if (/mac/i.test(plat)) for (const p of document.querySelectorAll("[data-mac-extra]")) p.textContent += V.MAC_EXTRA;
    Paper.copy(live); Paper.tiles();
    const fork = document.getElementById("install"); if (fork) Fork5.rails(fork);
    return live;
  };

  V.lerpRect = (a, b, p) => ({ x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p, w: a.w + (b.w - a.w) * p, h: a.h + (b.h - a.h) * p });
  V.place = (el, r, W) => { el.style.transform = `translate3d(${r.x}px,${r.y}px,0) scale(${r.w / W})`; };
  V.clamp01 = (x) => Math.max(0, Math.min(1, x));
  V.ease = (p) => (p < .5 ? 4 * p * p * p : 1 - (2 - 2 * p) ** 3 / 2);
})();
</script>

  // ⌘⌥←/→ focus, ⌘⌥Return full width. Omarchy defaults: Super+←/→ focus, Super+Alt+F full width.
  const CHORDS = {
    mac: { left: ["⌘", "⌥", "←"], right: ["⌘", "⌥", "→"], full: ["⌘", "⌥", "↩"], hold: ["⌘", "⌥"] },
    om: { left: ["Super", "←"], right: ["Super", "→"], full: ["Super", "Alt", "F"] },
  };
  D.kc = (keys) => `<span class="keys6">${keys.map((k) => `<kbd class="${k.length > 1 ? "wide" : /[⌘⌥⌃⇧]/.test(k) ? "mod" : ""}">${k}</kbd>`).join("")}</span>`;
  D.keys = (os, dir = "left") => D.kc(CHORDS[os][dir]).replace('class="keys6"', `class="keys6" data-os="${os}"`);
  D.press = (el, p) => { for (const k of el.querySelectorAll("kbd")) k.style.setProperty("--press", p); };
})();
// A still desktop picture at a virtual 1440x900, scaled to its container by the page (D6.fit).
// wins: [[kind, widthFraction], ...]; the window at index f is focused and centred.
(() => {
  const D = window.D6;
  D.still = (os, wins = [["mu", .34], ["ph", .5], ["ch", .5]], f = 1) => {
    const W = 1440, gap = os === "om" ? 10 : 18, top = os === "om" ? 40 : 72, bot = os === "om" ? 10 : 126; // Omarchy: 30px bar, gaps_in 5 (10 between), gaps_out 10
    const ws = wins.map(([k, w]) => ({ k, w: Math.round(W * w) }));
    let x = 0; for (const w of ws) { w.x = x; x += w.w + gap; }
    const off = W / 2 - (ws[f].x + ws[f].w / 2);
    const strip = `<div class="strip">${ws.map((w, i) => Paper.app(w.k, "s" + i, i + 1).replace('class="app', `style="left:${w.x + off}px;top:${top}px;width:${w.w}px;height:${900 - top - bot}px" class="app${i === f ? " f6" : ""}`)).join("")}</div>`;
    return `<div class="still6"><div class="in6">${os === "mac" ? D.mac(strip, "Photos") : D.om(strip, 2)}</div></div>`;
  };
  D.fit = (root = document) => {
    const fit = () => { for (const s of root.querySelectorAll(".still6")) s.firstElementChild.style.transform = `scale(${s.clientWidth / 1440})`; };
    fit(); addEventListener("resize", fit);
  };
})();
</script>
<script>
// captions; the reduced-motion list below is built from the same lines
const C = { land: V5.CAPS[0], none: V5.CAPS[1], drag: "Drag an edge to any width.", full: "Take the whole screen when you need it.", rest: "The rest waits just off screen.",
  walk: "Step window to window from the keyboard.", swipe: "Swipe and the whole strip scrolls.", pair: V5.CAPS[3], mini: "The minimap shows where you are." };
document.querySelector(".k-beats").innerHTML = [C.land, C.none, C.drag, C.full, C.rest, C.walk + " (⌘⌥← on macOS, Super+← on Omarchy)", C.swipe + " (hold ⌘⌥ on macOS)", C.pair, C.mini].map((x) => `<li>${x}</li>`).join("");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches, phone0 = innerWidth <= 700;
// desktop with motion: the install section hangs off the story's two screens
if (!reduced && !phone0) document.documentElement.classList.add("dock6");

const hero = '<article class="app hero" data-id="hero"><div class="tb" aria-hidden="true"><span class="dots"></span><b>Paper</b><span class="n">1</span></div><div class="bd" id="hero-bd"></div><div class="ring"></div></article>';
const apps = V5.APPS([["ph", "ph", 2], ["mu", "mu", 3], ["ch", "ch", 4]]);
document.getElementById("lm").innerHTML = D6.mac(`<div class="strip s1">${hero}${apps}</div>`, "Paper");
document.getElementById("hero-bd").innerHTML = V5.heroHTML();
const s1 = document.querySelector(".s1");
const picture = (html) => html.replace(/<h1 id="title">/, '<p class="h1">').replace("</h1>", "</p>").replace(/ id="[^"]*"/g, "").replace(/ data-copy/g, "");
document.getElementById("lo").innerHTML = D6.om(`<div class="strip s2" inert>${picture(s1.innerHTML)}</div>`, 1);
const s2 = document.querySelector(".s2");
document.getElementById("after-pin").textContent = V5.COPIED;
document.getElementById("trunk6").innerHTML = `${Fork5.cmd(Fork5.CURL, "after-trunk")}<p class="k-after" id="after-trunk" data-mac-extra style="color:var(--hi-text)">${V5.COPIED}</p><p>This command detects your system.</p>`;
for (const n of document.querySelectorAll(".nm")) n.innerHTML = n.dataset.os === "mac" ? LOGOS.apple + "macOS" : LOGOS.linux + "Linux";
document.querySelector(".swipe").innerHTML = D6.kc(["⌘", "⌥"]) + '<span class="plus">+</span><span class="pad"><i style="left:38px"></i><i style="left:60px"></i></span>';
const stills = { mac: D6.still("mac", [["mu", .34], ["ph", .5], ["ch", .5]]), lin: D6.still("om", [["mu", .34], ["ph", .5], ["ch", .5]]) };
document.querySelector(".pair6").innerHTML = stills.mac + D6.keys("mac", "left") + stills.lin + D6.keys("om", "left");
document.getElementById("main").innerHTML = V5.forkHTML(stills) + V5.moreHTML() + V5.closeHTML();
document.querySelector(".fork").insertAdjacentHTML("afterbegin", '<svg class="rails6b" aria-hidden="true"><path/></svg>');
V5.wire(); D6.fit();

const stage = document.querySelector(".stage"), lm = document.getElementById("lm"), lo = document.getElementById("lo"), vf = document.querySelector(".vf");
const bz = [...document.querySelectorAll(".bz")], nm = [...document.querySelectorAll(".nm")], kb = [...document.querySelectorAll(".kb")];
const pair = document.querySelector(".pair6"), trunk = document.getElementById("trunk6"), pin = document.querySelector(".pin");
const rIn = document.querySelector(".rails6 .r-in"), rOut = document.querySelector(".rails6 .r-out");
const macChrome = [...lm.querySelectorAll(".d6 > .cb, .d6 > .cf")], omChrome = [...lo.querySelectorAll(".d6 > .cb, .d6 > .cf")];
const GAP = 48, VS = .45, R = 28;
const keyDir = ["", ""];
function keys(i, os, dir) { if (keyDir[i] !== dir) { keyDir[i] = dir; kb[i].innerHTML = D6.keys(os, dir); } }
// a key goes down at the start of its beat, holds while the strip moves, then comes back up
const pressAt = (u) => (u < 0 ? 0 : u < .1 ? u / .1 : u < .42 ? 1 : Math.max(0, 1 - (u - .42) / .12));
const box = (el, r, pad = 0) => Object.assign(el.style, { transform: `translate(${r.x - pad}px,${r.y - pad}px)`, width: r.w + 2 * pad + "px", height: r.h + 2 * pad + "px" });
const fork = document.getElementById("install"), rb = fork.querySelector(".rails6b path");
const capEl = document.querySelector(".cap"), cur = document.querySelector(".cur"), swipe = document.querySelector(".swipe"), maps = [...document.querySelectorAll(".map")];
// a window's place on the strip, read from the engine's own styles (strip units)
const slot = (el) => ({ x: parseFloat(el.style.transform.slice(12)) || 0, w: parseFloat(el.style.width) || 0, o: +el.style.opacity });
function drawMap(m, i, focus) {
  const wins = [...s1.querySelectorAll(".app")].map((el) => ({ id: el.dataset.id, ...slot(el) })).filter((w) => w.o > .5);
  const tot = Math.max(...wins.map((w) => w.x + w.w)), MW = 300, k = MW / tot;
  m.style.width = MW + 10 + "px";
  m.innerHTML = wins.map((w) => `<b class="${w.id === focus ? "f" : ""}" style="left:${5 + w.x * k}px;width:${Math.max(4, w.w * k - 3)}px"></b>`).join("")
    + `<u style="left:${Math.max(0, 5 + (i.fc - i.vw / 2) * k - 2)}px;width:${Math.min(MW + 6, i.vw * k + 4)}px"></u>`;
}

Paper.story({
  root: document.querySelector(".story"), stage, strips: [s1, s2],
  start: { order: ["hero", "ph"], w: { hero: "hero", ph: .5 }, focus: "hero" },
  steps: [
    { open: "mu", end: true, w: .34, say: C.land },
    { open: "ch", end: true, w: .5, say: C.none },
    { resize: "ch", w: .67, focus: "ch", say: C.drag },
    { resize: "ch", w: 1, focus: "ch", say: C.full },
    { zoom: "view", focus: "ch", say: C.rest },
    { zoom: "view", focus: "mu", say: C.walk },
    { zoom: "view", focus: "ph", say: C.walk },
    { zoom: "view", focus: "hero", say: C.walk },
    { zoom: "view", focus: "ch", say: C.swipe },
    { zoom: "view", focus: "ch", say: C.pair },
    { zoom: "view", focus: "mu", say: C.mini },
    { zoom: "view", focus: "mu", say: "" },
  ],
  viewScale: VS, stillAt: 0,
  heroW: (W) => Math.min(W * .84, Math.max(620, W * .5), 860),
  geom: (W, H) => { const top = W < 700 ? 60 : 72, bottom = W < 700 ? 150 : 126, h = H - top - bottom; return { cy: top + h / 2, h, zoomH: h * .8 }; },
  phoneScale: .8, gap: 18, hold: .38,
  cap: document.querySelector(".cap"),
  onRender: (t, i) => {
    const W = i.W, H = i.H, phone = W < 700, u = t - i.k;
    // the screen: where the view sits, at the strip's current scale
    const fw = i.vw * i.sc, fh = i.H * i.sc / i.S0, fx = i.tx + (i.fc - i.vw / 2) * i.sc, fy = i.cy - i.cy * i.sc / i.S0;
    // beats: 0-1 land, 2 drag, 3 full width, 4 zoom, 5-7 key walk, 8 swipe, 9 split, 10 minimaps + both keys, 11 dock
    const zoom = V5.ease(V5.clamp01((t - 4) / .62)), split = phone ? 0 : V5.ease(V5.clamp01((t - 9) / .62)), dock = phone ? 0 : V5.ease(V5.clamp01((t - 11) / .62));
    const half = (fw + GAP) / 2, dy = Math.max(0, 250 - fy) * dock;
    const mac = { x: fx - half * split, y: fy + dy, w: fw, h: fh }, om = { x: fx + half, y: fy + dy, w: fw, h: fh };
    // the frame is born at the page's edges and shrinks with the zoom; the strip outside it dims
    box(vf, { ...mac });
    vf.style.opacity = t < 4 ? 0 : (1 - split);
    vf.style.setProperty("--dim", (.62 * zoom + .38 * split).toFixed(3));
    vf.querySelector("span").style.opacity = V5.clamp01((t - 4.4) / .4) * (1 - split);
    // the Mac: chrome fades in around the frame; the layer slides left with it
    lm.style.transform = `translate(${-half * split}px,${dy}px)`;
    lm.style.clipPath = split > 0 ? `inset(${fy}px ${W - fx - fw}px ${H - fy - fh}px ${fx}px round 12px)` : "";
    if (s2.firstElementChild.style.top !== "40px") omHeights();
    // the desktop chrome is drawn at page size; put it on the screen frame at the frame's scale
    const onFrame = `translate(${fx}px,${fy}px) scale(${fw / W})`;
    for (const c of macChrome) { c.style.opacity = split; c.style.transform = onFrame; }
    for (const c of omChrome) c.style.transform = onFrame;
    // Omarchy: the same strip, slid in from the right, clipped to its own screen
    lo.style.opacity = split > 0 ? 1 : 0;
    lo.style.transform = `translate(${half + (1 - split) * W * .6}px,${dy}px)`;
    lo.style.clipPath = `inset(${fy}px ${W - fx - fw}px ${H - fy - fh}px ${fx}px)`;
    box(bz[0], mac, 9); box(bz[1], { ...om, x: om.x + (1 - split) * W * .6 }, 9);
    bz.forEach((b) => (b.style.opacity = split));
    nm[0].style.transform = `translate(${mac.x}px,${mac.y - 58}px)`; nm[1].style.transform = `translate(${om.x}px,${om.y - 58}px)`;
    nm.forEach((n) => (n.style.opacity = split * (1 - dock)));
    // keys: full width on the bare strip, the walk under the frame, then both systems together
    const fullK = t >= 2.85 && t < 4.1, walking = t >= 4.85 && t < 8.05, both = t >= 9.6 && t < 11.2;
    keys(0, "mac", fullK ? "full" : "left"); keys(1, "om", "left");
    const kx = phone ? W / 2 : fullK ? W - 180 : walking ? fx + fw / 2 : mac.x + fw / 2;
    const ky = phone ? H - 230 : fullK ? H - 114 : both ? mac.y + fh + 74 : mac.y + fh + 26;
    kb[0].style.transform = `translate(${kx}px,${ky}px)`;
    kb[1].style.transform = `translate(${om.x + fw / 2}px,${om.y + fh + 74}px)`;
    kb[0].style.opacity = fullK || walking || both ? 1 : 0; kb[1].style.opacity = both && !phone ? 1 : 0;
    const keyBeat = [3, 5, 6, 7, 10].includes(i.k) ? pressAt(u) : 0;
    D6.press(kb[0], keyBeat); D6.press(kb[1], i.k === 10 ? keyBeat : 0);
    // the mouse: grabs the focused window's right edge and drags it wider
    const ch = s1.querySelector('[data-id="ch"]').getBoundingClientRect(), sr = stage.getBoundingClientRect();
    const curOn = t >= 1.75 && t < 2.95;
    cur.style.opacity = curOn ? Math.min(1, (t - 1.75) / .15, (2.95 - t) / .12) : 0;
    cur.style.transform = `translate(${ch.right - sr.left}px,${ch.top - sr.top + ch.height * .55}px)`;
    // the swipe: hold ⌘⌥ and two fingers slide while the strip pans forward
    const swOn = t >= 7.9 && t < 9.05;
    swipe.style.opacity = swOn ? Math.min(1, (t - 7.9) / .15, (9.05 - t) / .12) : 0;
    swipe.style.transform = `translate(${phone ? W / 2 : fx + fw / 2}px,${phone ? H - 236 : mac.y + fh + 18}px)`;
    const fing = i.k === 8 ? V5.clamp01(u / .62) : 0;
    swipe.querySelectorAll(".pad i").forEach((d, n) => (d.style.transform = `translateX(${(1 - fing) * 30 - fing * 26}px)`));
    D6.press(swipe, swOn ? 1 : 0);
    // the minimaps under both screens: the whole strip, the focused window, and the part each screen shows
    const mapOn = phone ? 0 : V5.clamp01((t - 9.45) / .3) * (1 - V5.clamp01((t - 11) / .2));
    maps.forEach((m) => (m.style.opacity = mapOn));
    if (mapOn > 0) { const f = i.k >= 10 && u > .3 ? "mu" : "ch"; drawMap(maps[0], i, f); drawMap(maps[1], i, f);
      maps[0].style.transform = `translate(${mac.x + fw / 2}px,${mac.y + fh + 24}px)`; maps[1].style.transform = `translate(${om.x + fw / 2}px,${om.y + fh + 24}px)`; }
    // phone: no room for two screens side by side; the two still pictures take over
    if (phone) { const po = V5.clamp01((t - 9) / .4); pair.style.opacity = po; lm.style.opacity = 1 - po; vf.style.opacity = (t < 4 ? 0 : 1) * (1 - po); D6.press(pair, i.k === 10 ? keyBeat : 0); kb[0].style.opacity = fullK || walking ? 1 : 0; }
    // the install trunk drops in above the two screens, and rails run into them and on down the page
    trunk.style.opacity = dock; trunk.classList.toggle("on", dock > .9);
    // the last caption gives way to the install trunk and its rails
    capEl.style.opacity = dock > 0 ? 1 - dock : "";
    pin.style.opacity = t > .5 && dock < .5 ? 1 : 0; pin.style.pointerEvents = t > .5 && dock < .5 ? "" : "none";
    if (dock > 0) {
      const tb = 40 + trunk.offsetHeight + 12, x0 = W / 2, x1 = mac.x + fw / 2, x2 = om.x + fw / 2, ys = (tb + mac.y - 9) / 2;
      const br = (x) => `M${x0},${ys - R} Q${x0},${ys} ${x0 + Math.sign(x - x0) * R},${ys} H${x - Math.sign(x - x0) * R} Q${x},${ys} ${x},${ys + R} V${mac.y - 12}`;
      rIn.setAttribute("d", `M${x0},${tb} V${ys - R} ${br(x1)} ${br(x2)}`);
      rOut.setAttribute("d", `M${x1},${mac.y + fh + 12} V${H} M${x2},${mac.y + fh + 12} V${H}`);
    }
    rIn.style.opacity = rOut.style.opacity = dock;
  },
});

// the install section: columns under the two screens, rails continuing from the stage
// Omarchy windows run nearly full height (30px bar, 10px outer gaps); the engine sizes every strip the same, so redo this one after it
function omHeights() { const H = stage.clientHeight; for (const a of s2.querySelectorAll(".app")) Object.assign(a.style, { top: "40px", height: H - 50 + "px" }); }
omHeights(); addEventListener("resize", omHeights);
function drawDockRails() {
  if (!document.documentElement.classList.contains("dock6")) return;
  // the docked layout, not the current frame: two screens of W x VS with GAP between, centred
  const W = stage.clientWidth, fw = W * VS, x1 = W / 2 - (fw + GAP) / 2, x2 = W / 2 + (fw + GAP) / 2, x0 = W / 2;
  fork.style.setProperty("--cw", fw + "px"); fork.style.setProperty("--cg", GAP + "px");
  const o = fork.getBoundingClientRect(), rel = (el) => { const r = el.getBoundingClientRect(); return { y: r.top - o.top, b: r.bottom - o.top }; };
  const cols = [...fork.querySelectorAll(".col")], who = rel(cols[0].querySelector(".who")), rejoin = rel(fork.querySelector(".rejoin"));
  const yEnd = Math.max(...cols.map((c) => rel(c).b)) + 20, ym = (yEnd + rejoin.y) / 2;
  const back = (x) => `M${x},${yEnd} V${ym - R} Q${x},${ym} ${x + Math.sign(x0 - x) * R},${ym} H${x0 - Math.sign(x0 - x) * R} Q${x0},${ym} ${x0},${ym + R}`;
  rb.setAttribute("d", `M${x1},0 V${who.y - 16} M${x2},0 V${who.y - 16} ${back(x1)} ${back(x2)} M${x0},${ym + R} V${rejoin.y - 6}`);
}
drawDockRails(); addEventListener("resize", drawDockRails); document.fonts?.ready.then(drawDockRails);
</script>
